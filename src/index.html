<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Line Grid</title>
  <meta name="description" content="Line Grid server monitoring theme for Lite.">
  <meta name="line-grid-version" content="0.5.1">
  <script>
    (function () {
      var t = localStorage.getItem("mmwx-theme") === "light" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.colorScheme = t;
      var fx = { grain: "1", count: "1", expose: "1" };
      try { var s = JSON.parse(localStorage.getItem("mmwx-fx") || "{}"); Object.keys(fx).forEach(function (k) { if (s[k] != null) fx[k] = String(s[k]); }); } catch (e) {}
      document.documentElement.setAttribute("data-fx-grain", fx.grain);
      document.documentElement.setAttribute("data-fx-count", fx.count);
      document.documentElement.setAttribute("data-fx-expose", fx.expose);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" data-inline-href="dist/css/app.css" href="./css/app.css">
</head>
<body>
  <div class="fx-grain" aria-hidden="true"></div>
  <a class="skip" href="#main">跳到内容</a>
  <div class="shell">
    <header class="top">
      <div>
        <p class="eyebrow">Node / Infrastructure · <span class="live"><i></i>实时</span></p>
        <h1 id="page-title">节点状态</h1>
      </div>
      <div class="top-tools">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换日间模式" title="日间" aria-pressed="false">
          <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.3 3.3l1.3 1.3M11.4 11.4l1.3 1.3M3.3 12.7l1.3-1.3M11.4 4.6l1.3-1.3"/></svg>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="站点页面">
          <button type="button" data-home="nodes" class="is-on">节点</button>
          <button type="button" data-home="network">网络状况</button>
          <button type="button" data-home="resource">资源概况</button>
        </nav>
        <a class="icon-btn calc-entry" href="https://vps.ss/" target="_blank" rel="noopener noreferrer" aria-label="打开 VPS 剩余价值计算器" title="VPS 剩余价值计算器">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v17M5 6h14M8 20h8"/><path d="M7 6 4 13h6L7 6Zm10 0-3 7h6l-3-7Z"/><path d="M4 13c.7 1.7 5.3 1.7 6 0M14 13c.7 1.7 5.3 1.7 6 0"/></svg>
        </a>
        <a class="icon-btn admin-entry" href="/admin" aria-label="Lite 后台管理" title="Lite 后台管理">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L3.4 17.6a2.1 2.1 0 0 0 3 3l5.9-5.9a4 4 0 0 0 5.4-5.4l-2.6 2.6-3-1-1-3 2.6-2.6Z"/></svg>
        </a>
      </div>
    </header>
    <main id="main"></main>
    <footer class="foot" id="foot"></footer>
  </div>
  <div class="overlay" id="overlay" hidden>
    <section class="stage" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <header class="stage-bar">
        <button class="back" id="win-back" type="button">← 返回</button>
        <div class="stage-id">
          <p class="window-kicker" id="win-kicker">Node / Detail</p>
          <h2 id="win-title">节点</h2>
        </div>
        <button class="window-x" id="win-close" type="button" aria-label="关闭">×</button>
      </header>
      <nav class="stage-nav" id="stage-nav" aria-label="节点详情页面"></nav>
      <div class="stage-body" id="win-body"></div>
    </section>
  </div>
  <div class="finance-overlay" id="finance-overlay" hidden>
    <section class="finance-stage" role="dialog" aria-modal="true" aria-labelledby="finance-title">
      <header class="finance-bar">
        <div>
          <p class="window-kicker">Finance / Monthly</p>
          <h2 id="finance-title">月均成本明细</h2>
        </div>
        <button class="window-x" id="finance-close" type="button" aria-label="关闭月均成本明细">×</button>
      </header>
      <div class="finance-body" id="finance-body"></div>
    </section>
  </div>
  <div id="chart-tip" hidden></div>
  <script data-inline-metadata="dist/metadata/nodes.json"></script>
  <script data-inline-src="dist/js/fx.js"></script>
  <script data-inline-src="dist/js/config.js"></script>
  <script data-inline-src="dist/js/data.js"></script>
  <script data-inline-src="dist/js/enrich.js"></script>
  <script data-inline-src="dist/js/komari.js"></script>
  <script data-inline-src="dist/js/api.js"></script>
  <script data-inline-src="dist/js/lite.js"></script>
  <script data-inline-src="dist/js/charts.js"></script>
  <script data-inline-src="dist/js/land.js"></script>
  <script data-inline-src="dist/js/app.js"></script>
</body>
</html>
