<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Line Grid · Lite 节点流量重置日</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:#101018;color:#f3f2f7}body{padding:16px}
.card{max-width:980px;margin:0 auto;border:1px solid #30303f;border-radius:12px;background:#14141f;overflow:hidden}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:17px;border-bottom:1px solid #2b2b38}.title{font-size:17px;font-weight:700}.help{margin-top:5px;color:#aaa9b7;font-size:12px;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button{height:32px;border:1px solid #454458;border-radius:7px;background:#1b1b27;color:#eee;padding:0 11px;cursor:pointer;font:600 12px/1 system-ui,sans-serif}button.primary{border-color:#6259d8;background:#5047c9;color:#fff}button:disabled{opacity:.5;cursor:wait}button[hidden]{display:none}
.tools{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #2b2b38;background:#12121b}.search{min-width:0;flex:1;height:34px;border:1px solid #38384a;border-radius:7px;background:#0f0f18;color:#f2f2f6;padding:0 11px;outline:none}.summary{font-size:12px;color:#9695a4;white-space:nowrap}
.table-head,.row{display:grid;grid-template-columns:minmax(0,1fr) 170px 180px;align-items:center}.table-head{height:34px;padding:0 17px;background:#171722;color:#8f8e9d;font-size:11px;border-bottom:1px solid #2b2b38}.list{max-height:560px;overflow:auto}.row{min-height:48px;padding:7px 17px;border-bottom:1px solid #282834;gap:16px}.row:hover{background:#181824}.row.hidden{display:none}.node{min-width:0}.name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{margin-top:2px;color:#777685;font:10px/1.25 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.current{text-align:right;font-size:12px}.current small{display:block;margin-top:2px;color:#777685}.edit{text-align:right}.reset{width:150px;height:32px;border:1px solid #3a394b;border-radius:6px;background:#0e0e17;color:#fff;padding:0 8px}.changed{border-color:#6d65e8}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-top:1px solid #2b2b38;background:#12121b;color:#8f8e9d;font-size:11px}.status.ok{color:#8fa676}.status.warn{color:#c4a56a}.status.bad{color:#d37b78}.empty{padding:42px 18px;text-align:center;color:#8e8d9b;font-size:13px}.migration{padding:10px 14px;border-bottom:1px solid #2b2b38;background:#181720;color:#b9b6c7;font-size:12px;line-height:1.55}.migration[hidden]{display:none}
@media(max-width:680px){body{padding:8px}.head{display:block}.actions{margin-top:12px;justify-content:flex-start}.table-head,.row{grid-template-columns:minmax(0,1fr) 96px 126px;padding-left:11px;padding-right:11px;gap:7px}.reset{width:116px}.current small{display:none}}
</style>
</head>
<body>
<section class="card">
  <div class="head">
    <div>
      <div class="title">Lite 原生流量重置日</div>
      <div class="help">直接读写 Lite Client 的 <code>traffic_reset_day</code>。跟随 Agent = null，关闭 = 0，每月 1～31 日 = 对应日期。账期边界由 Lite 后端统一管理。</div>
    </div>
    <div class="actions">
      <button type="button" id="reload-btn">重新读取</button>
      <button type="button" id="migrate-btn" hidden>迁移旧 Line Grid 设置</button>
      <button type="button" class="primary" id="save-btn">保存修改</button>
    </div>
  </div>
  <div class="migration" id="migration-box" hidden></div>
  <div class="tools"><input class="search" id="search" placeholder="搜索 VPS / UUID / 地区…" autocomplete="off"><span class="summary" id="summary">载入中…</span></div>
  <div class="table-head"><span>VPS</span><span style="text-align:right">数据库当前值</span><span style="text-align:right">修改为</span></div>
  <div class="list" id="list"><div class="empty">正在读取 Lite 节点…</div></div>
  <div class="foot"><span id="status" class="status">需要管理员登录。</span><span>Line Grid 不再保存第二套账期配置</span></div>
</section>
<script>
(function(){
  'use strict';
  const list=document.getElementById('list');
  const search=document.getElementById('search');
  const summary=document.getElementById('summary');
  const statusEl=document.getElementById('status');
  const saveBtn=document.getElementById('save-btn');
  const reloadBtn=document.getElementById('reload-btn');
  const migrateBtn=document.getElementById('migrate-btn');
  const migrationBox=document.getElementById('migration-box');
  let nodes=[];
  let legacySettings={};
  const values=new Map();
  const savedValues=new Map();

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function normalize(s){return String(s||'').trim().replace(/\s+/g,' ').toLowerCase();}
  function compact(s){return normalize(s).replace(/[\s._-]+/g,'');}
  function sameValue(a,b){return (a==null?null:Number(a))===(b==null?null:Number(b));}
  function resetLabel(v){if(v==null)return '跟随 Agent';if(Number(v)===0)return '关闭';return '每月 '+Number(v)+' 日';}
  function optionHtml(value){let out='<option value="agent">跟随 Agent</option><option value="0">关闭</option>';for(let i=1;i<=31;i++)out+='<option value="'+i+'">每月 '+i+' 日</option>';return out;}
  function parseSelectValue(raw){if(raw==='agent')return null;const n=Number(raw);return Number.isInteger(n)&&n>=0&&n<=31?n:null;}

  async function rpc(method,params){
    const resp=await fetch('/api/rpc2',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({jsonrpc:'2.0',id:Date.now()+Math.random(),method:method,params:params||{}})});
    if(!resp.ok)throw new Error('RPC HTTP '+resp.status);
    const body=await resp.json();
    if(body&&body.error)throw new Error(body.error.message||('RPC '+method+' failed'));
    return body&&Object.prototype.hasOwnProperty.call(body,'result')?body.result:body;
  }

  async function readLegacy(){
    try{
      const resp=await fetch('/api/public',{cache:'no-store',credentials:'same-origin'});
      if(!resp.ok)return {};
      const body=await resp.json();
      const info=body&&body.data?body.data:body;
      return info&&info.theme_settings&&typeof info.theme_settings==='object'&&!Array.isArray(info.theme_settings)?info.theme_settings:{};
    }catch(e){return {};}
  }

  function legacyPlan(){
    const hasDefault=legacySettings&&legacySettings.trafficResetDay!=null;
    const rawDefault=Number(legacySettings&&legacySettings.trafficResetDay);
    const defaultDay=Number.isInteger(rawDefault)&&rawDefault>=1&&rawDefault<=31?rawDefault:null;
    const raw=String(legacySettings&&legacySettings.trafficResetOverrides||'').trim();
    if(!hasDefault&&!raw)return null;
    const byId=new Map(nodes.map(function(n){return [n.uuid,n];}));
    const byName=new Map(),byCompact=new Map();
    nodes.forEach(function(n){const nk=normalize(n.name),ck=compact(n.name);if(!byName.has(nk))byName.set(nk,[]);byName.get(nk).push(n);if(!byCompact.has(ck))byCompact.set(ck,[]);byCompact.get(ck).push(n);});
    const overrides=new Map();const unknown=[];
    raw.split(/\r?\n/).forEach(function(line){const src=line.trim();if(!src||src.startsWith('#'))return;const m=src.match(/^(.+?)\s*=\s*(\d{1,2})\s*$/);if(!m){unknown.push(src);return;}const day=Number(m[2]);if(day<1||day>31){unknown.push(src);return;}const key=m[1].trim();let node=byId.get(key);if(!node){let arr=byName.get(normalize(key));if(arr&&arr.length===1)node=arr[0];if(!node){arr=byCompact.get(compact(key));if(arr&&arr.length===1)node=arr[0];}}if(node)overrides.set(node.uuid,day);else unknown.push(src);});
    return {defaultDay:defaultDay,overrides:overrides,unknown:unknown};
  }

  function updateMigrationUI(){
    const plan=legacyPlan();
    if(!plan){migrateBtn.hidden=true;migrationBox.hidden=true;return;}
    migrateBtn.hidden=false;migrationBox.hidden=false;
    const defaultText=plan.defaultDay==null?'无有效默认值':('默认 '+plan.defaultDay+' 日');
    migrationBox.textContent='检测到旧 Line Grid 账期配置：'+defaultText+'，'+plan.overrides.size+' 个节点独立值'+(plan.unknown.length?'，'+plan.unknown.length+' 行无法匹配':'')+'。迁移只会填入当前编辑表，点击“保存修改”后才写入 Lite。';
  }

  function applyLegacyPlan(){
    const plan=legacyPlan();if(!plan)return;
    nodes.forEach(function(n){if(plan.overrides.has(n.uuid))values.set(n.uuid,plan.overrides.get(n.uuid));else if(plan.defaultDay!=null)values.set(n.uuid,plan.defaultDay);});
    render();
    statusEl.textContent='旧配置已转换到编辑表，尚未写入 Lite；确认后点击“保存修改”。';statusEl.className='status warn';
  }

  function render(){
    const q=normalize(search.value);let shown=0,changed=0;
    list.innerHTML=nodes.map(function(n){
      const match=!q||normalize(n.name).includes(q)||normalize(n.uuid).includes(q)||normalize(n.region).includes(q);if(match)shown++;
      const current=savedValues.has(n.uuid)?savedValues.get(n.uuid):null;
      const next=values.has(n.uuid)?values.get(n.uuid):current;
      const dirty=!sameValue(current,next);if(dirty)changed++;
      return '<div class="row'+(match?'':' hidden')+'" data-uuid="'+esc(n.uuid)+'"><div class="node"><div class="name">'+esc(n.name||n.uuid)+'</div><div class="meta">'+esc((n.region?n.region+' · ':'')+n.uuid)+'</div></div><div class="current">'+esc(resetLabel(current))+'<small>Lite DB</small></div><div class="edit"><select class="reset'+(dirty?' changed':'')+'" data-reset>'+optionHtml()+'</select></div></div>';
    }).join('')||'<div class="empty">没有节点</div>';
    list.querySelectorAll('[data-reset]').forEach(function(sel){const row=sel.closest('.row');const uuid=row.getAttribute('data-uuid');const current=savedValues.has(uuid)?savedValues.get(uuid):null;const next=values.has(uuid)?values.get(uuid):current;sel.value=next==null?'agent':String(next);});
    summary.textContent=shown+'/'+nodes.length+' 台 · '+changed+' 项待保存';
    saveBtn.disabled=changed===0;
  }

  async function load(){
    saveBtn.disabled=true;reloadBtn.disabled=true;migrateBtn.disabled=true;statusEl.textContent='正在读取 Lite 管理数据…';statusEl.className='status warn';list.innerHTML='<div class="empty">正在读取 Lite 节点…</div>';
    try{
      const result=await Promise.all([rpc('admin:listClients',{}),readLegacy()]);
      const data=Array.isArray(result[0])?result[0]:[];legacySettings=result[1]||{};
      nodes=data.map(function(n,i){return {uuid:String(n.uuid||''),name:String(n.name||n.uuid||'未命名节点'),region:String(n.region_override||n.region||''),weight:Number(n.weight||0),reset:n.traffic_reset_day==null?null:Number(n.traffic_reset_day),i:i};}).filter(function(n){return !!n.uuid;}).sort(function(a,b){return a.weight-b.weight||a.i-b.i;});
      values.clear();savedValues.clear();nodes.forEach(function(n){savedValues.set(n.uuid,n.reset);values.set(n.uuid,n.reset);});
      render();updateMigrationUI();statusEl.textContent='已从 Lite 数据库读取 '+nodes.length+' 台节点。';statusEl.className='status ok';
    }catch(err){
      nodes=[];values.clear();savedValues.clear();render();statusEl.textContent='读取失败：'+(err&&err.message||err)+'。请确认当前会话已登录 Lite 管理员。';statusEl.className='status bad';
    }finally{reloadBtn.disabled=false;migrateBtn.disabled=false;}
  }

  async function save(){
    const changed=nodes.filter(function(n){return !sameValue(savedValues.get(n.uuid),values.get(n.uuid));});
    if(!changed.length)return;
    saveBtn.disabled=true;reloadBtn.disabled=true;migrateBtn.disabled=true;statusEl.textContent='正在写入 '+changed.length+' 台节点…';statusEl.className='status warn';
    let done=0;
    try{
      for(const n of changed){await rpc('admin:editClient',{uuid:n.uuid,traffic_reset_day:values.get(n.uuid)});done++;statusEl.textContent='正在写入 '+done+'/'+changed.length+'…';}
      statusEl.textContent='已保存 '+done+' 台节点，正在重新读取数据库…';statusEl.className='status ok';await load();
    }catch(err){statusEl.textContent='保存中断（已完成 '+done+'/'+changed.length+'）：'+(err&&err.message||err);statusEl.className='status bad';reloadBtn.disabled=false;migrateBtn.disabled=false;render();}
  }

  list.addEventListener('change',function(ev){const sel=ev.target.closest('[data-reset]');if(!sel)return;const row=sel.closest('.row');const uuid=row&&row.getAttribute('data-uuid');if(!uuid)return;values.set(uuid,parseSelectValue(sel.value));render();statusEl.textContent='有未保存修改。';statusEl.className='status warn';});
  search.addEventListener('input',render);saveBtn.addEventListener('click',save);reloadBtn.addEventListener('click',load);migrateBtn.addEventListener('click',applyLegacyPlan);
  load();
})();
</script>
</body>
</html>
