<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Komari Monitor</title>
  <meta name="description" content="A simple server monitor tool.">
  <script>
    (function () {
      var t = localStorage.getItem("mmwx-theme") === "light" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.colorScheme = t;
      var fx = { grain: "1", count: "1", expose: "1" };
      try { var s = JSON.parse(localStorage.getItem("mmwx-fx") || "{}"); Object.keys(fx).forEach(function (k) { if (s[k] != null) fx[k] = String(s[k]); }); } catch (e) {}
      document.documentElement.setAttribute("data-fx-grain", fx.grain);
      document.documentElement.setAttribute("data-fx-count", fx.count);
      document.documentElement.setAttribute("data-fx-expose", fx.expose);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
:root {
  --globe-rim: rgba(8, 8, 8, 0.36);
  --sans: "Instrument Sans", "Source Han Sans SC", "Noto Sans SC", sans-serif;
  --serif: "Instrument Serif", "Songti SC", "Noto Serif SC", serif;
  --mono: "IBM Plex Mono", "Source Han Mono SC", ui-monospace, monospace;
  --pad: clamp(20px, 3.4vw, 48px);
  --max: 1360px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --void: #0c0c0c;
  --void-2: #0c0c0c;
  --ink: #d5d0c4;
  --ink-soft: #c4beaf;
  --ink-dim: #aea89a;
  --ink-faint: #4a463c;
  --line: rgba(213, 208, 196, 0.08);
  --line-strong: rgba(213, 208, 196, 0.16);
  --cell-line: #1f1e1b;
  --gold: #c4a56a;
  --gold-dim: rgba(196, 165, 106, 0.16);
  --live: #8fa676;
  --down: #b06d52;
  --wash: rgba(213, 208, 196, 0.06);
  --shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
}

html[data-theme="light"] {
  --globe-rim: rgba(42, 33, 20, 0.2);
  --void: #e4d3ae;
  --void-2: #e4d3ae;
  --ink: #2a2114;
  --ink-soft: #4a3c26;
  --ink-dim: #6d5b3a;
  --ink-faint: #b79d6e;
  --line: rgba(42, 33, 20, 0.12);
  --line-strong: rgba(42, 33, 20, 0.2);
  --cell-line: rgba(42, 33, 20, 0.12);
  --gold: #8a5e1e;
  --gold-dim: rgba(138, 94, 30, 0.16);
  --live: #4f6638;
  --down: #8f4a30;
  --wash: rgba(42, 33, 20, 0.06);
  --shadow: 0 20px 48px rgba(42, 33, 20, 0.12);
}

* { box-sizing: border-box; }

html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--void);
  color: var(--ink);
  font-family: var(--sans);
  font-feature-settings: "ss01" 1, "cv11" 1;
  text-rendering: optimizeLegibility;
}

body {
  min-height: 100dvh;
  position: relative;
}

@property --void { syntax: "<color>"; inherits: true; initial-value: #0c0c0c; }
@property --void-2 { syntax: "<color>"; inherits: true; initial-value: #0c0c0c; }
@property --ink { syntax: "<color>"; inherits: true; initial-value: #d5d0c4; }
@property --ink-soft { syntax: "<color>"; inherits: true; initial-value: #c4beaf; }
@property --ink-dim { syntax: "<color>"; inherits: true; initial-value: #aea89a; }
@property --ink-faint { syntax: "<color>"; inherits: true; initial-value: #4a463c; }
@property --line { syntax: "<color>"; inherits: true; initial-value: rgba(213, 208, 196, 0.08); }
@property --line-strong { syntax: "<color>"; inherits: true; initial-value: rgba(213, 208, 196, 0.16); }
@property --cell-line { syntax: "<color>"; inherits: true; initial-value: #1f1e1b; }
@property --gold { syntax: "<color>"; inherits: true; initial-value: #c4a56a; }
@property --gold-dim { syntax: "<color>"; inherits: true; initial-value: rgba(196, 165, 106, 0.16); }
@property --live { syntax: "<color>"; inherits: true; initial-value: #8fa676; }
@property --down { syntax: "<color>"; inherits: true; initial-value: #b06d52; }
@property --wash { syntax: "<color>"; inherits: true; initial-value: rgba(213, 208, 196, 0.06); }
@property --globe-rim { syntax: "<color>"; inherits: true; initial-value: rgba(8, 8, 8, 0.36); }

html[data-fx-expose="1"] {
  transition:
    --void 1.35s cubic-bezier(0.45, 0.05, 0.15, 1),
    --void-2 1.35s cubic-bezier(0.45, 0.05, 0.15, 1),
    --ink 1.35s cubic-bezier(0.45, 0.05, 0.15, 1),
    --ink-soft 1.35s cubic-bezier(0.45, 0.05, 0.15, 1),
    --ink-dim 1.35s cubic-bezier(0.45, 0.05, 0.15, 1),
    --ink-faint 1.35s cubic-bezier(0.45, 0.05, 0.15, 1),
    --line 1.35s cubic-bezier(0.45, 0.05, 0.15, 1),
    --line-strong 1.35s cubic-bezier(0.45, 0.05, 0.15, 1),
    --cell-line 1.35s cubic-bezier(0.45, 0.05, 0.15, 1),
    --gold 1.35s cubic-bezier(0.45, 0.05, 0.15, 1),
    --gold-dim 1.35s cubic-bezier(0.45, 0.05, 0.15, 1),
    --live 1.35s cubic-bezier(0.45, 0.05, 0.15, 1),
    --down 1.35s cubic-bezier(0.45, 0.05, 0.15, 1),
    --wash 1.35s cubic-bezier(0.45, 0.05, 0.15, 1),
    --globe-rim 1.35s cubic-bezier(0.45, 0.05, 0.15, 1),
    background-color 1.35s cubic-bezier(0.45, 0.05, 0.15, 1),
    color 1.35s cubic-bezier(0.45, 0.05, 0.15, 1);
}

.atlas .globe-disk { stroke: var(--ink); stroke-opacity: 0.42; }
.atlas .globe-wire { stroke: var(--ink); stroke-opacity: 0.16; }
.atlas .globe-sweep { stroke: var(--ink); }
.atlas .globe-base { stroke: var(--ink); stroke-opacity: 0.4; }
.atlas .globe-link { stroke: var(--ink); opacity: 0.32; }
.atlas .globe-caption { fill: var(--ink); opacity: 0.32; }

html[data-theme="light"] .atlas .globe-disk { stroke-opacity: 0.58; }
html[data-theme="light"] .atlas .globe-wire { stroke-opacity: 0.4; }
html[data-theme="light"] .atlas .globe-base { stroke-opacity: 0.5; }
html[data-theme="light"] .atlas .globe-link { opacity: 0.42; }
html[data-theme="light"] .atlas .globe-caption { opacity: 0.42; }

.fx-grain {
  pointer-events: none;
  position: fixed;
  inset: 0;
  z-index: 24;
  opacity: 0;
  background: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2764%27 height=%2764%27 viewBox=%270 0 64 64%27%3E%3Cfilter id=%27n%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%27.82%27 numOctaves=%273%27 stitchTiles=%27stitch%27/%3E%3C/filter%3E%3Crect width=%27100%25%27 height=%27100%25%27 filter=%27url(%23n)%27 opacity=%27.52%27/%3E%3C/svg%3E") repeat;
  background-size: 160px 160px;
  mix-blend-mode: overlay;
}

html[data-fx-grain="1"] .fx-grain { opacity: 0.15; }

html[data-theme="light"] .fx-grain {
  mix-blend-mode: multiply;
}

html[data-theme="light"][data-fx-grain="1"] .fx-grain { opacity: 0.09; }

.fleet .val { font-variant-numeric: tabular-nums; }

#fx-panel {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 86;
  width: 188px;
  background: var(--void);
  color: var(--ink);
  border: 1px solid var(--line-strong);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.04em;
}

#fx-panel header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  color: var(--ink-dim);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 10px;
}

#fx-panel.is-min .fx-body { display: none; }
#fx-panel.is-min header { border-bottom: 0; }

#fx-panel .fx-min {
  appearance: none;
  background: none;
  border: 0;
  color: var(--ink-dim);
  cursor: pointer;
  font: inherit;
  padding: 0 2px;
}

.fx-body { padding: 8px 10px 10px; }

.fx-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 4px 0;
  color: var(--ink-soft);
}

.fx-row input { accent-color: var(--gold); }

.fx-row select {
  appearance: none;
  background: var(--void);
  color: var(--ink);
  border: 1px solid var(--line-strong);
  font: inherit;
  padding: 1px 6px;
}

.skip {
  position: absolute;
  left: -999px;
  top: 8px;
  background: var(--ink);
  color: var(--void);
  padding: 8px 12px;
  z-index: 20;
}

.skip:focus { left: 8px; }

.shell {
  position: relative;
  z-index: 1;
  max-width: var(--max);
  margin: 0 auto;
  padding: 28px var(--pad) 36px;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 28px;
}

.top-tools {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  flex: none;
}

.eyebrow {
  margin: 0 0 8px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.top h1 {
  margin: 0;
  font-family: var(--sans);
  font-size: clamp(40px, 6vw, 68px);
  font-weight: 600;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.list-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 4px 0 10px;
}

.list-bar-left {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

.list-bar-k {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.live {
  color: var(--live);
  letter-spacing: 0.18em;
}

.live i {
  display: inline-block;
  width: 5px;
  height: 5px;
  margin-right: 6px;
  background: var(--live);
  vertical-align: 1px;
  animation: live-tick 1.8s steps(1, end) infinite;
}

@keyframes live-tick {
  50% { opacity: 0.18; }
}

.site-nav {
  display: flex;
  border: 1px solid var(--line);
}

.site-nav button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink-soft);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.04em;
  padding: 7px 12px;
  cursor: pointer;
}

.site-nav button + button { border-left: 1px solid var(--line); }

.site-nav button.is-on,
.site-nav button:hover,
.site-nav button:focus-visible {
  color: var(--ink);
  font-weight: 600;
  background: var(--wash);
  outline: none;
}

.views {
  display: flex;
  gap: 8px;
  flex: none;
}

[hidden] {
  display: none !important;
}

.icon-btn {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink-soft);
  cursor: pointer;
  border-radius: 2px;
  transition: border-color 160ms var(--ease), color 160ms var(--ease), background 160ms var(--ease);
}

.icon-btn svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.4;
}

.icon-btn:hover,
.icon-btn:focus-visible {
  border-color: var(--line-strong);
  color: var(--ink);
  outline: none;
}

.icon-btn.is-on {
  color: var(--ink);
  background: var(--wash);
  border-color: var(--line-strong);
}

.back {
  appearance: none;
  border: 0;
  background: none;
  color: var(--ink-dim);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  cursor: pointer;
  padding: 8px 0;
}

.back:hover,
.back:focus-visible {
  color: var(--ink);
  outline: none;
}

.board {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border: 1px solid var(--cell-line);
}

.cell {
  appearance: none;
  -webkit-appearance: none;
  position: relative;
  min-width: 0;
  padding: 22px 22px 18px;
  border: 0;
  border-right: 1px solid var(--cell-line);
  border-bottom: 1px solid var(--cell-line);
  background: transparent;
  color: inherit;
  text-align: left;
  cursor: pointer;
  font: inherit;
}

.cell:nth-child(3n) { border-right: 0; }
.cell:nth-last-child(-n + 3) { border-bottom: 0; }

.cell::before {
  content: "";
  position: absolute;
  left: 0;
  top: 16px;
  bottom: 16px;
  width: 1px;
  background: var(--ink-faint);
  opacity: 0.7;
  pointer-events: none;
}

.cell.is-ok::before { background: var(--live); opacity: 0.55; }
.cell.is-hot::before { background: var(--gold); opacity: 0.7; }
.cell.is-bad::before,
.cell.is-down::before { background: var(--down); opacity: 0.75; }

.cell:hover::before,
.cell:focus-visible::before {
  top: 10px;
  bottom: 10px;
  width: 2px;
  opacity: 1;
}

.cell:hover::after,
.cell:focus-visible::after {
  content: "";
  position: absolute;
  inset: 8px;
  pointer-events: none;
  opacity: 0.85;
  background:
    linear-gradient(var(--ink-dim), var(--ink-dim)) left top / 12px 1px no-repeat,
    linear-gradient(var(--ink-dim), var(--ink-dim)) left top / 1px 12px no-repeat,
    linear-gradient(var(--ink-dim), var(--ink-dim)) right top / 12px 1px no-repeat,
    linear-gradient(var(--ink-dim), var(--ink-dim)) right top / 1px 12px no-repeat,
    linear-gradient(var(--ink-dim), var(--ink-dim)) left bottom / 12px 1px no-repeat,
    linear-gradient(var(--ink-dim), var(--ink-dim)) left bottom / 1px 12px no-repeat,
    linear-gradient(var(--ink-dim), var(--ink-dim)) right bottom / 12px 1px no-repeat,
    linear-gradient(var(--ink-dim), var(--ink-dim)) right bottom / 1px 12px no-repeat;
}

.card-coord {
  position: absolute;
  right: 14px;
  bottom: 10px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--ink-dim);
  opacity: 0.28;
  pointer-events: none;
}

.cell:hover .card-coord,
.cell:focus-visible .card-coord {
  opacity: 1;
  color: var(--ink-soft);
}

.cell:hover .name,
.cell:focus-visible .name { color: var(--ink); }

.cell:focus-visible {
  outline: 1px solid var(--ink);
  outline-offset: -1px;
  z-index: 2;
}

.card { position: relative; }

.card-face {
  min-height: 168px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
}

.cc {
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
  flex: none;
}

.name {
  font-size: 19px;
  font-weight: 560;
  letter-spacing: -0.03em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--live);
  box-shadow: 0 0 0 3px rgba(156, 175, 126, 0.12);
  flex: none;
}

.dot:not(.is-off) {
  animation: pulse-dot 2.8s ease-in-out infinite;
}

.dot.is-off {
  background: var(--down);
  box-shadow: none;
  animation: none;
}

@keyframes pulse-dot {
  0%, 100% { box-shadow: 0 0 0 3px rgba(143, 166, 118, 0.14); }
  50% { box-shadow: 0 0 0 6px rgba(143, 166, 118, 0.05); }
}

.status {
  margin-left: auto;
  font-size: 13px;
  color: var(--ink-soft);
  flex: none;
}

.speeds {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  color: var(--ink-dim);
  font-size: 13px;
  line-height: 1.45;
}

.speeds b {
  font-weight: 500;
  color: var(--ink-soft);
}

.spark-wrap {
  position: relative;
  height: 42px;
}

.spark-wrap .ms {
  position: absolute;
  right: 0;
  top: -2px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--ink);
}

.spark-wrap .ms.is-hot { color: var(--gold); }

.scope-cur { pointer-events: none; }

.meters {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
}

.meter {
  min-width: 0;
}

.meter span {
  display: block;
  font-size: 13px;
  color: var(--ink-dim);
  margin-bottom: 6px;
}

.meter i {
  display: block;
  height: 2px;
  background: var(--line-strong);
  position: relative;
}

.meter i::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  height: 2px;
  width: var(--p, 0%);
  background: var(--ink-soft);
}

.meta {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  color: var(--ink-dim);
}

.quota {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.quota-h {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  color: var(--ink-dim);
}

.quota-h b {
  font-weight: 500;
  color: var(--ink-soft);
}

.quota-bar {
  height: 5px;
  background: var(--line-strong);
  position: relative;
}

.quota-bar i {
  display: block;
  height: 100%;
  width: var(--p, 0%);
  background: var(--ink-soft);
}

.quota-bar.is-hot i { background: var(--gold); }
.quota-bar.is-full i { background: var(--down); }

.quota-bar::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--void), var(--void)),
    linear-gradient(var(--void), var(--void)),
    linear-gradient(var(--void), var(--void));
  background-size: 1px 100%;
  background-position: 25% 0, 50% 0, 75% 0;
  background-repeat: no-repeat;
  opacity: 0.45;
  pointer-events: none;
}

.quota-cell {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 4px;
  min-width: 0;
}

.quota-cell-n {
  font-size: 10px;
  line-height: 1.2;
  color: var(--ink-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.quota-cell-mobile { display: none; }

.quota-mini {
  width: 100%;
  height: 5px;
  background: var(--line-strong);
  display: block;
}

.quota-mini i {
  display: block;
  height: 100%;
  width: var(--p, 0%);
  background: var(--ink-soft);
}

.quota-mini.is-hot i { background: var(--gold); }
.quota-mini.is-full i { background: var(--down); }

.cell:hover,
.cell:focus-visible {
  background: color-mix(in srgb, var(--ink) 6%, transparent);
  outline: none;
  z-index: 2;
}

.row:hover,
.row:focus-visible,
.slab:hover,
.slab:focus-visible {
  background: var(--wash);
  box-shadow: inset 2px 0 0 var(--ink-soft);
  outline: none;
}

.bars-row {
  display: grid;
  grid-template-columns: 1fr 120px;
  gap: 16px;
  align-items: end;
}

.stat-col {
  font-size: 12px;
  color: var(--ink-dim);
  line-height: 1.7;
}

.stat-col b {
  color: var(--ink);
  font-weight: 500;
}

.more {
  justify-self: end;
  font-size: 13px;
  color: var(--ink-soft);
  letter-spacing: 0.04em;
}

.list {
  border: 1px solid var(--line);
}

.row {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  display: grid;
  grid-template-columns: 40px 156px 44px 168px 56px minmax(110px, 1fr) 44px 44px 44px 96px 48px;
  gap: 12px;
  align-items: center;
  padding: 15px 18px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.row .ms {
  position: static;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-soft);
  text-align: right;
}

.row .ms.is-hot { color: var(--gold); }

.row .spark-wrap { height: 28px; }
.row .spark-wrap .ms { display: none; }

.row:last-child { border-bottom: 0; }

.row:focus-visible {
  outline: none;
}

.row .name { font-size: 15px; white-space: nowrap; }
.row .hide-sm { white-space: nowrap; }
.row .spark-wrap { height: 28px; }

.cycle {

.cycle-head {

.ruler {

.ruler-hit {

.ruler-hit button {

.foot {

.foot b {

}

.foot .tag {

.detail {

}

.hero {

.hero-kicker {

.hero h2 {

.hero-sub {

}

.hero-pulse {

}

.hero-pulse .ms-xl {
  font-family: var(--serif);
  font-size: 40px;

  text-align: right;
}

.hero-pulse .ms-xl small {

  font-size: 13px;
  letter-spacing: 0.12em;
  color: var(--ink-dim);

}

.kpi {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border: 1px solid var(--line);
}

.kpi article {
  padding: 16px 18px 18px;
  border-right: 1px solid var(--line);
}

.kpi article:last-child { border-right: 0; }

.kpi .lbl {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--ink-soft);
  margin-bottom: 10px;
}

.kpi .val {
  font-size: 22px;
  letter-spacing: -0.03em;
}

.kpi .sub {
  margin-top: 6px;
  color: var(--ink-dim);
  font-size: 12px;
}

.panels {
  display: grid;
  grid-template-columns: 1.25fr 0.75fr;
  gap: 22px;
  align-items: start;
}

.panel {
  border: 1px solid var(--line);
  padding: 18px 18px 16px;
  min-width: 0;
  overflow: hidden;
}

.span-2 { grid-column: 1 / -1; }

.panel .spark {
  height: 140px;
  overflow: hidden;
}

.panel-h {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.panel-h h3 {
  margin: 0;
  font-size: 15px;
  font-weight: 550;
  letter-spacing: -0.02em;
}

.seg {
  display: flex;
  border: 1px solid var(--line);
}

.seg button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink-dim);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  padding: 5px 9px;
  cursor: pointer;
}

.seg button + button { border-left: 1px solid var(--line); }

.seg button.is-on,
.seg button:hover,
.seg button:focus-visible {
  color: var(--ink);
  background: var(--wash);
  outline: none;
}

.targets {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0 4px;
}

.chip {
  appearance: none;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink-dim);
  font-size: 12px;
  padding: 5px 9px;
  cursor: pointer;
}

.chip.is-on,
.chip:hover,
.chip:focus-visible {
  color: var(--ink);
  border-color: var(--line-strong);
  outline: none;
}

.routes {
  display: grid;
  gap: 0;
}

.route {
  display: grid;
  grid-template-columns: 64px 1fr;
  gap: 12px;
  align-items: baseline;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}

.route:last-child { border-bottom: 0; }

.route .car {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.sys {
  display: flex;
  flex-wrap: wrap;
  gap: 18px 28px;
  padding-top: 8px;
  color: var(--ink-dim);
  font-size: 13px;
}

.sys b { color: var(--ink-soft); font-weight: 500; }

.state {
  border: 1px solid var(--line);
  min-height: 280px;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 48px 20px;
}

.state h2 {
  margin: 12px 0 8px;
  font-family: var(--serif);
  font-weight: 400;
  font-size: 36px;
}

.state p { color: var(--ink-dim); margin: 0; }

.wave {
  width: 100%;
  height: 72px;
  display: block;
}

.spark, .bars, .ruler-svg {
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
}

@media (max-width: 1100px) {
  .home-globe, .fleet { grid-template-columns: 1fr; }
  .atlas-side { border-left: 0; border-top: 1px solid var(--line); }
  .bucket-strip { grid-template-columns: repeat(3, 1fr); }
  .timeline { grid-template-columns: repeat(3, 1fr); }
  .board { grid-template-columns: 1fr 1fr; }
  .cell:nth-child(3n) { border-right: 1px solid var(--cell-line); }
  .cell:nth-child(2n) { border-right: 0; }
  .cell:nth-last-child(-n + 3) { border-bottom: 1px solid var(--cell-line); }
  .cell:nth-last-child(-n + 2) { border-bottom: 0; }
  .row {
    grid-template-columns: 40px 1fr auto;
    grid-template-areas:
      "cc name st"
      "cc speeds speeds"
      "spark spark ms";
  }
  .row .cc { grid-area: cc; }
  .row .name { grid-area: name; }
  .row .status { grid-area: st; margin: 0; }
  .row .speeds { grid-area: speeds; }
  .row .spark-wrap { grid-area: spark; }
  .row .ms { grid-area: ms; }
  .row .hide-sm { display: none; }
  .row-h { display: none; }
  .kpi { grid-template-columns: 1fr 1fr; }
  .kpi article { border-bottom: 1px solid var(--line); }
  .panels, .hero, .foot { grid-template-columns: 1fr; }
  .hero-pulse { min-width: 0; }
  .bars-row { grid-template-columns: 1fr; }
}

@media (max-width: 720px) {
  .board { grid-template-columns: 1fr; }
  .cell { border-right: 0 !important; }
  .cell:nth-last-child(-n + 2) { border-bottom: 1px solid var(--cell-line); }
  .cell:last-child { border-bottom: 0; }
  .cell .card {
    background: transparent;
    outline: 0;
    box-shadow: none;
    transform: none;
    padding: 0;
  }
  .top { align-items: flex-start; }
  .top h1 { font-size: 36px; }
  .kpi { grid-template-columns: 1fr; }
  .foot { grid-template-columns: 1fr; }
}

@media (hover: none) {
  .cell:hover,
  .row:hover,
  .slab:hover {
    background: transparent;
    box-shadow: none;
  }
}

.stack {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
}

.slab {
  appearance: none;
  -webkit-appearance: none;
  display: block;
  width: 100%;
  padding: 20px 22px 18px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.slab:last-child { border-bottom: 0; }

.slab:focus-visible {
  outline: none;
}

.slab-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}

.slab-ms {
  display: block;
  font-family: var(--serif);
  font-size: 28px;
  letter-spacing: -0.04em;
  line-height: 1;
  margin-bottom: 6px;
}

.slab-ms small {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--ink-dim);
  margin-left: 6px;
}

.slab-ms.is-hot { color: var(--gold); }

.slab-grid {

  grid-template-columns: 1.05fr 0.95fr 1fr;
  gap: 0;
  align-items: start;
}

.slab-grid > div {

  border-right: 1px solid var(--line);

}

.slab-grid > div:first-child { padding-left: 0; }
.slab-grid > div:last-child { padding-right: 0; border-right: 0; }

.slab .spark-wrap { height: 44px; margin-top: 8px; }
.slab .meters { margin-top: 2px; }
.slab .meter i { height: 2px; }
.slab .meter i::after { height: 2px; background: var(--ink); }
.slab .more { color: var(--ink-dim); font-size: 12px; }

.slab-routes {
  margin-top: 10px;
  font-size: 12px;
  color: var(--ink-dim);
  line-height: 1.6;
}

.slab-routes b { color: var(--ink-soft); font-weight: 500; }

.row-h {
  cursor: default;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-dim);
  background: var(--wash);
}

.row-h:hover { background: var(--wash); }

.list {
  overflow-x: auto;
}

.row {
  min-width: 1080px;
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  padding: 28px 16px;
  background: rgba(0, 0, 0, 0.55);

}

}

.overlay[hidden] { display: none !important; }

.stage {

  to { opacity: 1; transform: none; }
}

.stage-bar {

  gap: 16px 20px;

.stage-id { min-width: 0; }

.window-kicker {

}

.stage-id h2 {
  margin: 0;
  font-family: var(--serif);

.stage-nav {

.window-x {

.stage-body {

.page {

.page-overview {

}

.page-ping,
.page-traffic {
  grid-template-rows: auto minmax(0, 1fr) auto;
}

.page-routes {

.page-system {
  grid-template-rows: minmax(0, 1fr);
}

.page .hero {

.page .hero h2 { display: none; }

.day-grid {

  min-height: 0;
}

.day-grid article {
  padding: 10px 12px;
  border-right: 1px solid var(--line);
  min-width: 0;
}

.day-grid article:last-child { border-right: 0; }

.route-cards {

.route-card {

.spec {

  padding: 18px 20px;

.spec .lbl {

  letter-spacing: 0.04em;
  color: var(--ink-soft);
}

.spec .val {
  font-size: clamp(16px, 1.8vw, 24px);
  letter-spacing: -0.03em;

.sheet {

  gap: 12px;
}

.sheet-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
}

.sheet-mid,
.sheet-bot {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 12px;
}

.panel.tight { padding: 12px 14px; }

.day-inline {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  margin-top: 8px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--ink-dim);
}

.sys-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 16px;
  font-size: 13px;
  color: var(--ink-dim);

  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-family: var(--mono);
  color: var(--ink-dim);

.reg {

  -webkit-appearance: none;
  display: flex;
  justify-content: space-between;
  width: 100%;

  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;

  font-size: 13px;
  color: var(--ink-soft);

.reg b { color: var(--ink); font-weight: 500; }

}

.fleet article:last-child { border-right: 0; }

.fleet .lbl,
.atlas-side .lbl {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.04em;

.fleet .val { font-size: 22px; letter-spacing: -0.03em; }

.heat th {

.pick {

.atlas svg { width: 100%; height: 100%; display: block; }

  <script>
(function (global) {
  const KEY = "mmwx-fx";
  const DEFAULTS = {
    grain: "1",
    count: "1",
    expose: "1",
  };
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  let flags = load();
  let counted = false;

  function load() {
    const out = Object.assign({}, DEFAULTS);
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return out;
      const parsed = JSON.parse(raw);
      Object.keys(DEFAULTS).forEach(function (k) {
        if (parsed[k] === "0" || parsed[k] === "1" || parsed[k] === "auto" || parsed[k] === "on" || parsed[k] === "off") {
          out[k] = String(parsed[k]);
        }
      });
    } catch (e) {}
    return out;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(flags)); } catch (e) {}
  }

  function on(name) {
    return flags[name] === "1";
  }

  function apply() {
    const root = document.documentElement;
    root.setAttribute("data-fx-grain", flags.grain);
    root.setAttribute("data-fx-count", flags.count);
    root.setAttribute("data-fx-expose", flags.expose);
  }

  function set(name, value) {
    flags[name] = String(value);
    save();
    apply();
    document.dispatchEvent(new CustomEvent("mmwx-fx", { detail: name }));
    if (name === "count" && flags.count === "1") {
      counted = false;
      tickCounts(document.getElementById("main"));
    }
  }

  function tickCounts(root) {
    if (!root || counted || !on("count") || reduce.matches) return;
    const vals = root.querySelectorAll(".fleet .val");
    if (!vals.length) return;
    counted = true;
    Array.prototype.forEach.call(vals, function (el) {
      const text = (el.textContent || "").trim();
      const m = text.match(/^(-?[\d,.]+)\s*(.*)$/);
      if (!m) return;
      const target = parseFloat(m[1].replace(/,/g, ""));
      if (!isFinite(target)) return;
      const rest = m[2] || "";
      const decimals = (m[1].split(".")[1] || "").length;
      const t0 = performance.now();
      const dur = 740;
      function step(now) {
        const p = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - p, 3);
        const n = target * e;
        el.textContent = n.toFixed(decimals) + (rest ? " " + rest : "");
        if (p < 1) requestAnimationFrame(step);
        else el.textContent = text;
      }
      el.textContent = (0).toFixed(decimals) + (rest ? " " + rest : "");
      requestAnimationFrame(step);
    });
  }

  function expose(run) {
    run();
  }

  function localHost() {
    return /^(localhost|127\.0\.0\.1)$/i.test(location.hostname);
  }

  function mountPanel() {
    if (!localHost()) return;
    if (document.getElementById("fx-panel")) return;
    const box = document.createElement("aside");
    box.id = "fx-panel";
    box.setAttribute("aria-label", "本地试效果");
    box.innerHTML =
      '<header><span>本地试效果</span><button type="button" class="fx-min" aria-label="收起">–</button></header>' +
      '<div class="fx-body">' +
        row("grain", "纸纹", flags.grain === "1") +
        row("count", "数字进场", flags.count === "1") +
        row("expose", "日夜间曝光", flags.expose === "1") +
      "</div>";
    document.body.appendChild(box);
    box.addEventListener("change", function (ev) {
      const el = ev.target;
      const name = el.getAttribute("data-fx");
      if (!name) return;
      if (el.tagName === "SELECT") set(name, el.value);
      else set(name, el.checked ? "1" : "0");
    });
    box.querySelector(".fx-min").addEventListener("click", function () {
      box.classList.toggle("is-min");
    });
  }

  function row(name, label, onOff) {
    return '<label class="fx-row"><span>' + label + '</span><input type="checkbox" data-fx="' + name + '"' + (onOff ? " checked" : "") + "></label>";
  }

  apply();
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mountPanel);
  } else {
    mountPanel();
  }

  global.ProbeFX = {
    on: on,
    apply: apply,
    set: set,
    tickCounts: tickCounts,
    expose: expose,
    flags: flags,
  };
})(window);

</script>

  function bars(items, opt) {
    opt = opt || {};
    const w = opt.w || 240;
    const h = opt.h || 56;
    const list = items || [];
    const vals = list.map(function (it) { return typeof it === "number" ? it : n(it.total); });
    const max = Math.max.apply(null, vals.concat([1]));
    const gap = 6;
    const bw = (w - gap * (vals.length + 1)) / Math.max(vals.length, 1);
    const color = opt.color || inkRgba(isLight() ? 0.58 : 0.4);
    const last = gold();
    const rects = vals.map(function (v, i) {
      const bh = Math.max(2, (v / max) * (h - 8));
      const x = gap + i * (bw + gap);
      const y = h - bh;
      const fill = i === vals.length - 1 ? last : color;
      const tip = (opt.tips && opt.tips[i]) || (list[i] && list[i].tip) || String(v);

  function wave(opt) {

    const mid = h / 2;

    const cycles = 2.15;
    for (let x = 0; x <= w; x += 2) {
      const t = x / w;
      const env = t > 0.58 && t < 0.86 ? Math.sin((t - 0.58) / 0.28 * Math.PI) : 0;

  function stacked(items, opt) {
    opt = opt || {};

    const h = opt.h || 80;
    const list = items || [];

    const max = Math.max.apply(null, downs.map(function (d, i) { return d + ups[i]; }).concat([1]));

        '<rect class="chart-hit" data-tip="' + esc(tip) + '" x="' + x.toFixed(2) + '" y="' + (h - bhD - bhU).toFixed(2) + '" width="' + Math.max(2, bw).toFixed(2) + '" height="' + bhU.toFixed(2) + '" fill="' + gold() + '"/>';
    }).join("") + "</svg>";
  }

  function ruler(today, daysInMonth, opt) {
    opt = opt || {};
    const heights = opt.heights || [];
    const selected = opt.selected || today;
    const half = opt.halfDay;
    const w = 1000;
    const h = 48;
    const maxH = Math.max.apply(null, heights.concat([1]));
    let ticks = "";
    let labels = "";
    for (let d = 1; d <= daysInMonth; d += 1) {
      const x = ((d - 1) / Math.max(1, daysInMonth - 1)) * (w - 8) + 4;
      const future = d > today;
      const amp = heights[d - 1] != null ? 8 + (heights[d - 1] / maxH) * 18 : 8;
      const y2 = 26;
      const y1 = y2 - (future ? 6 : amp);
      const color = d === selected ? gold() : (future ? inkRgba(0.12) : inkRgba(0.28));
      ticks += '<line x1="' + x.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x.toFixed(1) + '" y2="' + y2 + '" stroke="' + color + '" stroke-width="' + (d === selected ? 1.6 : 1) + '"/>';
      const major = d === 1 || d === 5 || d === 10 || d === 15 || d === 20 || d === 30 || d === daysInMonth;
      if (major) {
        labels += '<text x="' + x.toFixed(1) + '" y="44" text-anchor="middle" fill="' + inkRgba(0.28) + '" font-size="11" font-family="IBM Plex Mono, monospace">' + String(d).padStart(2, "0") + "</text>";

  function multiSpark(seriesList, opt) {
    opt = opt || {};
    const w = opt.w || 960;
    const h = opt.h || 220;
    const series = (seriesList || []).filter(function (s) { return s && Array.isArray(s.points) && s.points.length; });

    let axes = '';
    if (showY) {
      [0, 0.5, 1].forEach(function (t) {
        const y = plotBottom - t * plotH;
        axes += '<text class="axis-label" x="' + (padL - 7) + '" y="' + (y + 3).toFixed(2) + '" text-anchor="end">' + esc(axisNumber(min + t * span)) + '</text>';
      });
      axes += '<text class="axis-unit" x="4" y="11">' + esc(opt.yUnit || '') + '</text>';
    }
    if (showX) {
      let labels = Array.isArray(opt.xLabels) && opt.xLabels.length >= 3 ? opt.xLabels.slice(0, 3) : null;
      if (!labels && minT != null && maxT != null) labels = [axisTime(minT), axisTime(minT + (maxT - minT) / 2), axisTime(maxT)];
      labels = labels || ['', '', ''];
      const xs = [padL, padL + plotW / 2, w - padR];
      labels.forEach(function (label, i) {
        axes += '<text class="axis-label axis-x" x="' + xs[i].toFixed(2) + '" y="' + (h - 5) + '" text-anchor="' + (i === 0 ? 'start' : i === 2 ? 'end' : 'middle') + '">' + esc(label) + '</text>';
      });
      axes += '<line class="axis-line" x1="' + padL + '" y1="' + plotBottom.toFixed(2) + '" x2="' + (w - padR) + '" y2="' + plotBottom.toFixed(2) + '"/>';
    }
    let paths = '';
    let hits = '';
    series.forEach(function (s, si) {
      const pts = s.points || [];
      const step = pts.length <= 1 ? 0 : plotW / (pts.length - 1);
      let d = '';
      let drawing = false;
      let seg = [];
      const segments = [];
      pts.forEach(function (p, i) {
        const v = p && p.value != null ? Number(p.value) : NaN;
        if (!Number.isFinite(v) || v < 0) { drawing = false; if (seg.length) segments.push(seg); seg = []; return; }
        const pt = p && p.t != null ? Number(p.t) : NaN;
        const x = Number.isFinite(pt) && minT != null && maxT != null && maxT > minT
          ? padL + ((pt - minT) / (maxT - minT)) * plotW

        const y = plotBottom - ((v - min) / span) * plotH;
        d += (drawing ? ' L ' : 'M ') + x.toFixed(2) + ' ' + y.toFixed(2);
        drawing = true;
        seg.push([x, y]);
        const tm = p && p.t ? axisTime(p.t) : String(i + 1);
        hits += '<circle class="chart-hit" data-tip="' + esc(String(s.label || s.key || '') + ' · ' + tm + ' · ' + v + ' ms') + '" cx="' + x.toFixed(2) + '" cy="' + y.toFixed(2) + '" r="5" fill="transparent"/>';
      });
      if (seg.length) segments.push(seg);
      if (d) {
        const color = colors[si % colors.length];
        segments.forEach(function (part) {
          if (!part.length) return;
          let ad = '';
          part.forEach(function (pt, i) { ad += (i ? ' L ' : 'M ') + pt[0].toFixed(2) + ' ' + pt[1].toFixed(2); });

    return '<div class="multi-chart"><svg class="multi-spark' + (showY || showX ? ' has-axes' : '') + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' + grid + paths + axes + hits + '</svg>' + legend + '</div>';

    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "  " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }

  function route() {
    const raw = (location.hash || "#/").replace(/^#/, "") || "/";
    const parts = raw.split("/").filter(Boolean);
    let view = "list";
    let node = null;
    let page = "overview";
    let section = "nodes";
    if (parts[0] === "network" || parts[0] === "resource") {
      section = parts[0];
      if (parts[1] === "node" && parts[2] != null) {
        node = decodeURIComponent(parts[2]);
        if (PAGES.indexOf(parts[3]) >= 0) page = parts[3];
      }
      home = section;
      return { view: view, node: node, page: page, home: section };
    }
    if (parts[0] === "column" || parts[0] === "list" || parts[0] === "grid") {
      view = parts[0];
      if (parts[1] === "node" && parts[2] != null) {
        node = decodeURIComponent(parts[2]);
        if (PAGES.indexOf(parts[3]) >= 0) page = parts[3];
      }
    } else if (parts[0] === "node" && parts[1] != null) {
      node = decodeURIComponent(parts[1]);
      if (PAGES.indexOf(parts[2]) >= 0) page = parts[2];
    } else if (parts[0] === "globe") {
      showGlobe = true;
      if (parts[1] === "node" && parts[2] != null) {
        node = decodeURIComponent(parts[2]);
        if (PAGES.indexOf(parts[3]) >= 0) page = parts[3];
      }
    }
    if (view === "grid" || view === "column" || view === "list") lastView = view;
    home = "nodes";
    return { view: view, node: node, page: page, home: "nodes" };
  }

  function viewHash(view, node, page, section) {
    const sec = section || home || "nodes";
    if (sec === "network" || sec === "resource") {
      if (node == null) return "#/" + sec;
      return "#/" + sec + "/node/" + encodeURIComponent(node) + (page && page !== "overview" ? "/" + page : "");
    }
    const base = !view || view === "list" ? "" : "/" + view;
    if (node == null) return "#" + (base || "/");
    const rest = page && page !== "overview" ? "/" + page : "";
    return "#" + (base || "") + "/node/" + encodeURIComponent(node) + rest;
  }

  function go(hash, ev) {
    if (ev) ev.preventDefault();
    location.hash = hash;
  }

  function iconGrid() {
    return '<svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5" height="5"/><rect x="9.5" y="1.5" width="5" height="5"/><rect x="1.5" y="9.5" width="5" height="5"/><rect x="9.5" y="9.5" width="5" height="5"/></svg>';

  function iconColumn() {

  function pingTips(values, stepMin) {
    const n = (values || []).length;
    const step = stepMin || 5;
    return (values || []).map(function (v, i) {
      const t = new Date(Date.now() - (n - 1 - i) * step * 60000);
      const clock = pad(t.getHours()) + ":" + pad(t.getMinutes());
      return clock + "  " + (v < 0 ? "无数据" : v + " ms");
    });
  }

  function trafficTips(rows) {
    return (rows || []).map(function (d) {
      const day = (d.date || "").slice(5) || "当日";
      return day + "  合计 " + fmtBytes(d.total, 1) + "  ↑ " + fmtBytes(d.uplink, 1) + "  ↓ " + fmtBytes(d.downlink, 1);
    });
  }

  function sparkOf(server, tall) {
    const p = primaryPing(server);
    let vals = p && p.buckets ? p.buckets.map(function (b) { return b.ms; }) : [];
    const ms = pingMs(server);
    if (!vals.length && ms != null) vals = [ms, ms];
    return (
      '<div class="spark-wrap">' +
        ProbeCharts.spark(vals, { w: tall ? 420 : 240, h: tall ? 64 : 40, color: ms != null && ms > 180 ? cssVar("--down", "#b06d52") : ms != null && ms > 80 ? cssVar("--gold", "#c4a56a") : cssVar("--live", "#8fa676"), tips: pingTips(vals, 5) }) +
        (tall ? "" : '<span class="ms' + latencyTone(ms) + '">' + (ms == null ? "—" : String(ms).padStart(3, "0") + " ms") + "</span>") +
      "</div>"
    );
  }

  function quotaTone(p) {
    return p >= 85 ? " is-full" : p >= 60 ? " is-hot" : "";
  }

  function quotaBar(server) {
    const used = server.traffic_used == null ? null : Number(server.traffic_used);
    const limit = Number(server.traffic_limit || 0);
    const p = used == null ? 0 : pct(used, limit);
    const remain = limit && used != null ? Math.max(0, limit - used) : null;
    const tip = used == null ? "暂无流量累计" : (limit ? ("已用 " + p.toFixed(1) + "%") : "无限额");
    return (
      '<div class="quota">' +
        '<div class="quota-h">' +
          "<span>已用 <b>" + fmtBytes(used, 1) + "</b>" + (limit ? " / " + fmtBytes(limit, 2) : "") + "</span>" +
          "<span>" + (limit ? "剩余 <b>" + fmtBytes(remain, 1) + "</b>" : "无限额") + "</span>" +
        "</div>" +
        '<div class="quota-bar' + quotaTone(p) + '" style="--p:' + (limit && used != null ? p : 0) + '%" data-tip="' + h(tip) + '"><i></i></div>' +
      "</div>"
    );
  }

  function quotaMini(server) {
    const used = server.traffic_used == null ? null : Number(server.traffic_used);
    const limit = Number(server.traffic_limit || 0);
    const p = used == null ? 0 : pct(used, limit);
    return (
      '<span class="quota-cell hide-sm" title="' + h(used == null ? "暂无流量累计" : (limit ? ("已用 " + p.toFixed(1) + "%") : "无限额")) + '">' +
        '<span class="quota-cell-n">' + fmtBytes(used, 1) + (limit ? " / " + fmtBytes(limit, 2) : "") + "</span>" +
        '<span class="quota-cell-mobile">' + fmtBytes(used, 1) + "</span>" +
        '<span class="quota-mini' + quotaTone(p) + '" style="--p:' + (limit && used != null ? p : 0) + '%"><i></i></span>' +
      "</span>"
    );
  }

  function meters(server) {
    const mem = pctMetric(server.mem_used, server.mem_total);
    const disk = pctMetric(server.disk_used, server.disk_total);
    const cpu = server.cpu_pct == null ? null : Number(server.cpu_pct);
    return (
      '<div class="meters">' +
        '<div class="meter"><span>CPU ' + pctText(cpu) + '</span><i style="--p:' + (cpu == null ? 0 : cpu) + '%"></i></div>' +
        '<div class="meter"><span>内存 ' + pctText(mem) + '</span><i style="--p:' + (mem == null ? 0 : mem) + '%"></i></div>' +
        '<div class="meter"><span>硬盘 ' + pctText(disk) + '</span><i style="--p:' + (disk == null ? 0 : disk) + '%"></i></div>' +
      "</div>"
    );
  }

  function cardTone(server) {
    if (!server.online) return " is-down";
    const ms = pingMs(server);
    const loss = pingLoss(server);
    if ((ms != null && ms > 180) || (loss != null && loss > 20)) return " is-bad";
    if (ms != null && ms > 80) return " is-hot";
    return " is-ok";
  }

  function hashText(text) {
    let x = 2166136261;
    String(text || "").split("").forEach(function (ch) { x ^= ch.charCodeAt(0); x = Math.imul(x, 16777619); });
    return x >>> 0;
  }

  function cityHintLL(server) {
    const text = [server.region_city, server.region_name, server.name].filter(Boolean).join(" ");
    for (let i = 0; i < CITY_HINTS.length; i += 1) {
      if (CITY_HINTS[i][0].test(text)) return CITY_HINTS[i][1].slice();
    }
    return null;
  }

  function scatterLL(base, server, index, scope) {
    const same = (state.servers || []).filter(function (s) {
      if (scope === "city") {
        const ll = cityHintLL(s);
        return ll && Math.abs(ll[0] - base[0]) < 0.01 && Math.abs(ll[1] - base[1]) < 0.01;
      }
      return (s.geo_country || s.region_country) === (server.geo_country || server.region_country) && !cityHintLL(s);
    });
    if (same.length <= 1) return base.slice();
    const rank = Math.max(0, same.findIndex(function (s) { return s.uuid === server.uuid; }));
    const seed = hashText(server.uuid || server.name || index);
    const angle = ((rank / same.length) * Math.PI * 2) + ((seed % 31) / 31) * 0.45;
    const ring = scope === "city" ? 0.28 + (rank % 2) * 0.16 : 2.2 + (rank % 3) * 0.9;
    const latScale = Math.max(0.4, Math.cos(base[1] * Math.PI / 180));
    return [wrapLon(base[0] + Math.cos(angle) * ring / latScale), Math.max(-78, Math.min(78, base[1] + Math.sin(angle) * ring))];
  }

  function serverLL(server, index) {
    // Important: Number(null) is 0, so test null explicitly before conversion.
    if (server.longitude != null && server.latitude != null && Number.isFinite(Number(server.longitude)) && Number.isFinite(Number(server.latitude))) {
      return [Number(server.longitude), Number(server.latitude)];
    }
    const city = cityHintLL(server);
    if (city) return scatterLL(city, server, index, "city");
    const base = COUNTRY_LL[server.geo_country || server.region_country];
    if (!base) return null;
    return scatterLL(base, server, index, "country");
  }

  function readRouteOverrides() {
    try {
      const raw = JSON.parse(localStorage.getItem(ROUTE_STORE_KEY) || "{}");
      return raw && typeof raw === "object" ? raw : {};
    } catch (_) {
      return {};
    }
  }

  function writeRouteOverrides(value) {
    localStorage.setItem(ROUTE_STORE_KEY, JSON.stringify(value || {}));
  }

  function effectiveRoutes(server) {
    const byCarrier = {};
    (server && server.return_routes || []).forEach(function (rt) {
      if (rt && rt.carrier) byCarrier[rt.carrier] = Object.assign({}, rt);
    });
    const local = readRouteOverrides()[server && server.uuid] || {};
    Object.keys(local).forEach(function (carrier) {
      const value = String(local[carrier] || "").trim();
      if (value) byCarrier[carrier] = { carrier: carrier, region: "", route_type: value, source: "local" };
      else delete byCarrier[carrier];
    });
    return ["telecom", "unicom", "mobile"].map(function (carrier) { return byCarrier[carrier]; }).filter(Boolean);
  }

  function routeValue(server, carrier) {
    const row = effectiveRoutes(server).find(function (rt) { return rt.carrier === carrier; });
    return row ? String(row.route_type || "") : "";
  }

  function routeSelect(server, carrier) {
    const value = routeValue(server, carrier);
    const choices = (ROUTE_PRESETS[carrier] || []).slice();
    if (value && !choices.some(function (p) { return p[0] === value; })) choices.push([value, "自定义 · " + value]);
    return '<label class="route-edit"><span>' + h(CARRIER[carrier] || carrier) + '</span><select data-route-carrier="' + attr(carrier) + '">' +
      choices.map(function (pair) { return '<option value="' + attr(pair[0]) + '"' + (pair[0] === value ? ' selected' : '') + '>' + h(pair[1]) + '</option>'; }).join("") +
      '</select></label>';
  }

  function cardCoord(server) {
    const ll = serverLL(server, 0);
    if (!ll) return (server.region_country || "——");
    return Math.abs(ll[1]).toFixed(1) + (ll[1] >= 0 ? "N" : "S") + "  " + Math.abs(ll[0]).toFixed(1) + (ll[0] >= 0 ? "E" : "W");
  }

  function lookAtCountry(cc) {
    const ll = COUNTRY_LL[cc];
    if (!ll) return;
    globeLon = ll[0];
    globeLat = Math.max(-78, Math.min(78, ll[1]));
    paintGlobe();
  }

  function card(server, i) {
    const loss = pingLoss(server);
    return (
      '<button class="cell' + cardTone(server) + '" data-index="' + attr(i) + '" type="button">' +
        '<div class="card">' +
          '<span class="card-coord">' + h(cardCoord(server)) + "</span>" +
          '<div class="card-face">' +
            '<div class="head">' +
              '<span class="cc">' + h(displayCountry(server) || "") + "</span>" +
              '<span class="name">' + h(server.name || "未命名") + "</span>" +
              '<span class="dot' + (server.online ? "" : " is-off") + '"></span>' +
              '<span class="status">' + (server.online ? "在线" : "离线") + "</span>" +
            "</div>" +
            '<div class="speeds">' +
              '<span>实时网速　↓ <b>' + fmtSpeed(server.download_speed) + "</b>　↑ <b>" + fmtSpeed(server.upload_speed) + "</b></span>" +
            "</div>" +
            sparkOf(server) +
            '<div class="card-loss' + lossTone(loss) + '">' + lossText(loss) + '</div>' +
            meters(server) +
            quotaBar(server) +
            '<div class="meta"><span>在线' + h(fmtDays(server.uptime).replace(/\s+/g, "")) + ' · 剩余' + remainingHTMLFor(server) + '</span></div>' +
          "</div>" +
        "</div>" +
      "</button>"
    );
  }

  function rowSpeedPair(server) {
    return '<span class="speed-part"><i>↓</i><b>' + fmtSpeed(server.download_speed) + '</b></span>' +
      '<span class="speed-part"><i>↑</i><b>' + fmtSpeed(server.upload_speed) + '</b></span>';
  }

  function row(server, i) {
    const ms = pingMs(server);
    const mem = pctMetric(server.mem_used, server.mem_total);
    const disk = pctMetric(server.disk_used, server.disk_total);
    return (
      '<button class="row" data-index="' + attr(i) + '" type="button">' +

        '<span class="status">' + (server.online ? "在线" : "离线") + "</span>" +
        '<span class="speeds row-speeds">' + rowSpeedPair(server) + '</span>' +
        '<span class="latency-cell"><span class="ms' + latencyTone(ms) + '">' + (ms == null ? "—" : ms + " ms") + '</span><small class="' + lossTone(pingLoss(server)).trim() + '">' + lossText(pingLoss(server)) + '</small></span>' +
        sparkOf(server) +
        '<span class="hide-sm">' + pctText(server.cpu_pct) + "</span>" +
        '<span class="hide-sm">' + pctText(mem) + "</span>" +
        '<span class="hide-sm">' + pctText(disk) + "</span>" +
        quotaMini(server) +
        '<span class="hide-sm">' + fmtDays(server.uptime) + "</span>" +
        '<span class="life-cost"><span class="life-remain">' + remainingHTMLFor(server) + '</span></span>' +
      "</button>"
    );
  }

  function sortHead(label, key) {
    const mark = listSortKey === key ? (listSortDir < 0 ? " ↓" : listSortDir > 0 ? " ↑" : "") : "";
    return '<button type="button" class="sort-head' + (listSortKey === key ? ' is-on' : '') + '" data-sort="' + attr(key) + '" title="点击排序：降序 → 升序 → 默认">' + h(label + mark) + '</button>';
  }

  function listHead() {
    return (
      '<div class="row row-h">' +
        sortHead("地区", "region") + sortHead("名称", "name") + sortHead("状态", "status") + sortHead("实时网速", "speed") + sortHead("延迟 / %", "latency") + "<span>曲线</span>" +
        sortHead("CPU", "cpu") + sortHead("内存", "memory") + sortHead("硬盘", "disk") + sortHead("流量", "traffic") + sortHead("在线", "uptime") + sortHead("剩余", "remaining") +
      "</div>" +
      '<div class="mobile-row-h" aria-hidden="true"><span>地区</span><span>VPS</span><span>状态</span><span>延迟</span><span>丢包</span><span>流量</span><span>剩余</span></div>'
    );
  }

  function slab(server, i) {
    const ms = pingMs(server);
    const st = dailyStats(server);
    const last7 = (server.daily_traffic || []).slice(-7);
    const routes = effectiveRoutes(server).map(function (rt) {
      return h(CARRIER[rt.carrier] || rt.carrier || "—") + " <b>" + h(rt.route_type || "—") + "</b>";
    }).join("　");
    return (
      '<button class="slab" data-index="' + attr(i) + '" type="button">' +
        '<div class="slab-top">' +
          '<div class="head">' +
            '<span class="cc">' + h(displayCountry(server) || "") + "</span>" +
            '<span class="name">' + h(server.name || "未命名") + "</span>" +
            '<span class="dot' + (server.online ? "" : " is-off") + '"></span>' +
            '<span class="status">' + (server.online ? "在线" : "离线") + " · " + h(server.region_city || server.region_name || "") + "</span>" +
          "</div>" +

        '<div class="slab-grid">' +

            '<div class="slab-ms' + latencyTone(ms) + '">' + (ms == null ? "—" : ms) + "<small>MS</small></div>" +
            '<div class="slab-loss' + lossTone(pingLoss(server)) + '">' + lossText(pingLoss(server)) + '</div>' +
            '<div class="speeds">↓ <b>' + fmtSpeed(server.download_speed) + "</b>　↑ <b>" + fmtSpeed(server.upload_speed) + "</b></div>" +
            sparkOf(server, true) +

          "<div>" +
            meters(server) +
            '<div style="margin-top:14px">' + quotaBar(server) + "</div>" +
            '<div class="meta" style="margin-top:10px"><span>在线' + h(fmtDays(server.uptime).replace(/\s+/g, "")) + ' · 剩余' + remainingHTMLFor(server) + '</span></div>' +
          "</div>" +
          "<div>" +
            '<div class="stat-col" style="margin-bottom:8px">近 7 日　均 ' + fmtBytes(st.avg, 1) + "　" + lossHTML(pingLoss(server)) + "</div>" +

          "</div>" +
        "</div>" +
      "</button>"
    );
  }

  function pulseInfo(day) {
    return pulse.find(function (p) { return p.day === day; }) || pulse[0];
  }

  function cycleBlock() {
    const today = new Date().getDate();
    const days = pulse.length || 31;
    const heights = pulse.map(function (p) { return p.total; });
    const usedToNow = pulse.filter(function (p) { return p.day <= today; }).reduce(function (a, b) { return a + b.total; }, 0);
    const half = pulse.find(function (p) { return p.acc >= usedToNow * 0.5 && p.day <= today; });
    const info = pulseInfo(pulseDay);
    const hits = pulse.map(function (p) {
      return '<button type="button" data-day="' + attr(p.day) + '" aria-label="' + attr(p.date) + '"></button>';
    }).join("");
    return (
      '<section class="cycle" aria-label="本月脉搏">' +
        '<div class="cycle-head">' +
          "<span>本月脉搏　<b>" + info.date.slice(5) + "</b>　全网 " + fmtBytes(info.total, 1) +
          (info.total ? "　最忙 " + h(info.peak) : "") +
          (info.offline ? "　·　曾掉线" : "") +
          (info.loss >= 1 ? "　·　" + info.loss + "%" : "") +
          "</span>" +
          "<span>已过 " + today + "/" + days + "　累计 " + fmtBytes(usedToNow, 1) + "　空心点 = 过半</span>" +
        "</div>" +
        '<div class="ruler">' +
          ProbeCharts.ruler(today, days, { heights: heights, selected: pulseDay, halfDay: half ? half.day : 0 }) +
          '<div class="ruler-hit">' + hits + "</div>" +
        "</div>" +
      "</section>"
    );
  }

  function fleetStrip() {
    const t = totals();
    const regions = {};
    (state.servers || []).forEach(function (s) {
      const k = s.region_name || s.region_country || "—";
      regions[k] = (regions[k] || 0) + 1;
    });
    const down = (state.servers || []).reduce(function (a, s) { return a + (s.download_speed || 0); }, 0);
    const up = (state.servers || []).reduce(function (a, s) { return a + (s.upload_speed || 0); }, 0);
    const monthCNY = aggregateCNY(state.servers || [], false);
    const monthGroups = costGroups(state.servers || [], false);
    const fxLabel = state._fx_source ? (state._fx_source === "cache" ? "汇率缓存" : state._fx_source === "stale-cache" ? "旧汇率缓存" : state._fx_source === "default" ? "备用汇率" : state._fx_source) : "汇率加载中";
    return (
      '<section class="fleet" aria-label="集群概览">' +
        "<article><div class='lbl'>节点</div><div class='val'>" + t.all + "</div><div class='sub'>在线 " + t.online + " · 离线 " + (t.all - t.online) + "</div></article>" +
        "<article><div class='lbl'>地区</div><div class='val'>" + Object.keys(regions).length + "</div><div class='sub'>独立地域</div></article>" +
        "<article><div class='lbl'>下行合计</div><div class='val'>" + fmtSpeed(down) + "</div><div class='sub'>上行 " + fmtSpeed(up) + "</div></article>" +
        "<article><div class='lbl'>流量累计</div><div class='val'>" + fmtBytes(t.used, 1) + "</div><div class='sub'>限额 " + fmtBytes(t.limit, 2) + "</div></article>" +
        "<article class='fleet-finance' data-finance-detail role='button' tabindex='0' aria-label='查看月均成本明细'><div class='lbl'>月均成本</div><div class='val'>" + (monthCNY == null ? "—" : ("≈ ¥" + monthCNY.toFixed(2))) + "</div><div class='sub'>" + h(fxLabel) + " · " + costGroupsHTML(monthGroups) + "</div></article>" +
      "</section>"
    );
  }

  function empty(title, text) {
    main.innerHTML =
      '<section class="state">' +
        ProbeCharts.wave({ w: 280, h: 64 }) +
        "<h2>" + h(title) + "</h2>" +
        "<p>" + h(text) + "</p>" +
      "</section>";
  }

  function renderChrome(r) {
    const titles = { nodes: state.title || "节点状态", network: "网络状况", resource: "资源概况" };
    titleEl.textContent = titles[r.home] || titles.nodes;
    titleEl.hidden = false;
    Array.prototype.forEach.call(document.querySelectorAll("#site-nav [data-home]"), function (btn) {
      btn.classList.toggle("is-on", btn.getAttribute("data-home") === r.home);
    });
    const bar = document.getElementById("views");
    if (bar) {
      Array.prototype.forEach.call(bar.querySelectorAll("[data-view]"), function (el) {
        const on = r.view === el.getAttribute("data-view");
        el.classList.toggle("is-on", on);
        el.setAttribute("aria-pressed", on ? "true" : "false");
      });
      const g = bar.querySelector("[data-globe]");
      if (g) {
        g.classList.toggle("is-on", showGlobe);
        g.setAttribute("aria-pressed", showGlobe ? "true" : "false");
      }
    }
  }

  function defaultListedServers() {
    const policy = String(state.offline_server_position || "Last");
    return (state.servers || []).map(function (s, i) { return { s: s, i: s.uuid || String(i), order: i }; }).sort(function (a, b) {
      if (policy === "First" && a.s.online !== b.s.online) return a.s.online ? 1 : -1;
      if (policy !== "Keep" && policy !== "First" && a.s.online !== b.s.online) return a.s.online ? -1 : 1;
      const aw = Number(a.s.weight || 0);
      const bw = Number(b.s.weight || 0);
      if (aw !== bw) return aw - bw;
      return Number(a.s._order == null ? a.order : a.s._order) - Number(b.s._order == null ? b.order : b.s._order);
    });
  }

  function remainingSortValue(server) {
    if (server.long_term) return Number.POSITIVE_INFINITY;
    if (!server.expires_at_raw) return Number.POSITIVE_INFINITY;
    const ts = new Date(server.expires_at_raw).getTime();
    return Number.isFinite(ts) ? Math.ceil((ts - Date.now()) / 86400000) : Number.POSITIVE_INFINITY;
  }

  function listSortValue(server, key) {
    if (key === "region") { const rd = regionDisplay(server); return (displayCountry(server) + " " + (rd.city || server.region_name || "")).toLowerCase(); }
    if (key === "name") return String(server.name || "").toLowerCase();
    if (key === "status") return server.online ? 1 : 0;
    if (key === "speed") return Number(server.download_speed || 0) + Number(server.upload_speed || 0);
    if (key === "latency") { const v = pingMs(server); return v == null ? -1 : v; }
    if (key === "cpu") return Number(server.cpu_pct == null ? -1 : server.cpu_pct);
    if (key === "memory") return pctMetric(server.mem_used, server.mem_total) ?? -1;
    if (key === "disk") return pctMetric(server.disk_used, server.disk_total) ?? -1;
    if (key === "traffic") return Number(server.traffic_used == null ? -1 : server.traffic_used);
    if (key === "uptime") return Number(server.uptime || 0);
    if (key === "remaining") return remainingSortValue(server);
    return 0;
  }

  function listedServers(applyInteractiveSort, applyRegionFilter) {
    let base = defaultListedServers();
    if (applyRegionFilter && regionFilter) {
      base = base.filter(function (item) { return regionDisplay(item.s).label === regionFilter; });
    }
    if (!applyInteractiveSort || !listSortKey || !listSortDir) return base;
    return base.map(function (item, idx) { return { item: item, idx: idx, value: listSortValue(item.s, listSortKey) }; }).sort(function (a, b) {
      let cmp = 0;
      if (typeof a.value === "string" || typeof b.value === "string") cmp = String(a.value).localeCompare(String(b.value), "zh-CN", { numeric: true, sensitivity: "base" });
      else cmp = Number(a.value) - Number(b.value);
      if (!Number.isFinite(cmp) || cmp === 0) cmp = a.idx - b.idx;
      return listSortDir < 0 ? -cmp : cmp;
    }).map(function (x) { return x.item; });
  }

  function serverByKey(key) {
    const k = String(key == null ? "" : key);
    return (state.servers || []).find(function (s, i) { return String(s.uuid || i) === k; }) || null;
  }

  function listToolbar(r) {
    return (
      '<div class="list-bar" id="views">' +
        '<span class="list-bar-k">机器清单</span>' +
        '<div class="views">' +
          '<button class="icon-btn' + (r.view === "list" ? " is-on" : "") + '" data-view="list" type="button" aria-label="横向排列" title="横向">' + iconList() + "</button>" +
          '<button class="icon-btn' + (r.view === "grid" ? " is-on" : "") + '" data-view="grid" type="button" aria-label="网格排列" title="网格">' + iconGrid() + "</button>" +
          '<button class="icon-btn' + (r.view === "column" ? " is-on" : "") + '" data-view="column" type="button" aria-label="列排列" title="列">' + iconColumn() + "</button>" +
          '<button class="icon-btn' + (showGlobe ? " is-on" : "") + '" data-globe type="button" aria-label="显示地球" title="地球开/关">' + iconGlobe() + "</button>" +
        "</div>" +
      "</div>"
    );
  }

  function renderFoot() {
    const t = totals();
    const source = liveMode ? "Komari RPC2" : (demoMode ? "演示数据" : "连接中");
    foot.innerHTML =
      "<div>总使用流量　<b>" + fmtBytes(t.used, 2) + " / " + fmtBytes(t.limit, 2) + "</b></div>" +
      "<div>在线服务器　<b>" + t.online + " / " + t.all + "</b></div>" +
      "<div class='foot-update'><span>最后更新　<b>" + clock(new Date()) + "</b></span><span class='foot-meta'>" + source + "　·　Powered by Komari Monitor</span></div>";
  }

  function listEmpty() {
    return '<section class="state"><h2>暂无节点</h2><p>官方接口还没有返回可展示的服务器。</p></section>';
  }

  function renderGrid(r) {
    const items = listedServers(false, true);
    main.innerHTML = fleetStrip() + globePanel() + listToolbar(r) + (items.length
      ? '<section class="board" aria-label="网格排列">' + items.map(function (item) {
        return card(item.s, item.i);
      }).join("") + "</section>"
      : listEmpty()) + cycleBlock();
  }

  function renderColumn(r) {

      return slab(item.s, item.i);
    }).join("") + "</section>" + cycleBlock();

  function renderList(r) {
    const items = listedServers(true, true);
    main.innerHTML = fleetStrip() + globePanel() + listToolbar(r) + '<section class="list" aria-label="横向排列">' + listHead() + items.map(function (item) {
      return row(item.s, item.i);
    }).join("") + "</section>" + cycleBlock();
  }

  function nodeCtx(index) {
    const s = serverByKey(index);
    if (!s) return null;
    if ((!targetKey || targetKey === "all") && s.ping && s.ping.length) targetKey = s.ping[0].key;
    const ping = (s.ping || []).find(function (p) { return p.key === targetKey; }) || (s.ping || [])[0] || null;
    const cacheKey = s.uuid + ":" + range + ":" + (targetKey || "all");
    const cached = seriesCache[cacheKey];
    let sparkVals = [];
    let multiSeries = [];
    if (cached) {
      sparkVals = (cached.series || []).map(function (p) { return p && p.value != null && Number.isFinite(Number(p.value)) ? Number(p.value) : -1; });
      multiSeries = cached.seriesByTask || [];
    } else if (range === "1h" && targetKey === "all") {
      multiSeries = (s.ping || []).map(function (p) { return { key: p.key, label: p.label, points: (p.buckets || []).map(function (b) { return { value: b.ms, t: b.t }; }) }; });
    } else if (range === "1h" && ping && ping.buckets) {
      sparkVals = ping.buckets.map(function (b) { return b.ms; });
    } else if (!liveMode && ping) {
      const hist = ProbeDemo.pingSeries(s, range, ping.key);
      sparkVals = (hist.series || []).map(function (p) { return p.value; });
    }
    return { s: s, ping: ping, sparkVals: sparkVals, multiSeries: multiSeries, st: dailyStats(s), last7: (s.daily_traffic || []).slice(-7) };
  }

  function heroMultiSeries(ctx) {
    const s = ctx.s;
    const cacheKey = s.uuid + ":" + range + ":all";
    const cached = seriesCache[cacheKey];
    if (cached && cached.seriesByTask && cached.seriesByTask.length) return cached.seriesByTask;
    if (range === "1h") {
      return (s.ping || []).map(function (p) {
        return { key: p.key, label: p.label, points: (p.buckets || []).map(function (b) { return { value: b.ms, t: b.t }; }) };
      }).filter(function (item) { return item.points.length; });
    }
    return [];
  }

  function heroPingSummary(s) {
    const pings = (s.ping || []).filter(function (p) { return p && p.current_ms != null && Number(p.current_ms) >= 0; });
    if (!pings.length) return null;
    const ms = pings.reduce(function (sum, p) { return sum + Number(p.current_ms); }, 0) / pings.length;
    const losses = pings.map(function (p) { return p.loss_pct == null ? null : Number(p.loss_pct); }).filter(Number.isFinite);
    return { current_ms: ms, loss_pct: losses.length ? losses.reduce(function (a, b) { return a + b; }, 0) / losses.length : null };
  }

  function pingAxisLabels() {
    const hours = range === "24h" ? 24 : range === "6h" ? 6 : 1;
    const end = Date.now();
    const start = end - hours * 3600000;
    const mid = start + (end - start) / 2;
    function tm(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    }
    return [tm(start), tm(mid), tm(end)];
  }

  function pingChartOpts(mode, base) {
    const opt = Object.assign({}, base || {});
    opt.showYAxis = mode === "y" || mode === "xy";
    opt.showXAxis = mode === "xy";
    opt.adaptiveY = true;
    opt.yUnit = "ms";
    if (opt.showXAxis) opt.xLabels = pingAxisLabels();
    return opt;
  }

  function heroPingChart(ctx, w, ht, mode) {
    const series = heroMultiSeries(ctx);
    if (series.length > 1 && ProbeCharts.multiSpark) return ProbeCharts.multiSpark(series, pingChartOpts(mode || "y", { w: w, h: ht }));
    if (series.length === 1) {
      const vals = (series[0].points || []).map(function (p) { return p && p.value != null ? Number(p.value) : -1; });
      const p = (ctx.s.ping || []).find(function (item) { return item.key === series[0].key; }) || (ctx.s.ping || [])[0] || null;
      const idx = Math.max(0, (ctx.s.ping || []).indexOf(p));
      return ProbeCharts.spark(vals, pingChartOpts(mode || "y", { w: w, h: ht, color: pingColor(p, idx), fillOpacity: 0.11, tips: pingTips(vals, range === "24h" ? 30 : range === "6h" ? 10 : 5) }));
    }
    return '<div class="chart-empty">暂无多线路延迟历史</div>';
  }

  function pingChart(ctx, w, ht, mode) {
    if (targetKey === "all" && ctx.multiSeries && ctx.multiSeries.length > 1 && ProbeCharts.multiSpark) {
      return ProbeCharts.multiSpark(ctx.multiSeries, pingChartOpts(mode || "y", { w: w, h: ht }));
    }
    const idx = Math.max(0, (ctx.s.ping || []).findIndex(function (p) { return ctx.ping && p.key === ctx.ping.key; }));
    return ProbeCharts.spark(ctx.sparkVals, pingChartOpts(mode || "y", { w: w, h: ht, color: pingColor(ctx.ping, idx), fillOpacity: 0.11, tips: pingTips(ctx.sparkVals, range === "24h" ? 30 : range === "6h" ? 10 : 5) }));
  }

  function trafficHistoryHTML(ctx, w, ht) {
    if (!ctx.last7.length) {
      const status = ctx.s.traffic_history_status === "loading" ? "历史流量加载中…" : "Komari 当前没有可用的近 7 日历史记录";
      return '<div class="chart-empty">' + h(status) + '</div>';
    }
    return ProbeCharts.bars(ctx.last7, { w: w, h: ht, tips: trafficTips(ctx.last7) });
  }

  function heroLine(s, ping) {
    const ms = ping && ping.current_ms != null ? Math.round(Number(ping.current_ms)) : null;
    return (
      '<header class="hero">' +
        "<div>" +
          '<div class="hero-sub">' +
            (s.online ? "在线" : "离线") + " · " + h(s.region_name || s.region_city || "") +
            (s.provider_name ? " · " + h(s.provider_name) : "") +
            " · 在线 " + fmtDays(s.uptime) +
          "</div>" +
        "</div>" +
        '<div class="hero-pulse">' +
          '<div class="ms-xl' + latencyTone(ms) + '">' + (ms == null ? "—" : ms) + "<small>MS</small></div>" +
          '<div class="hero-loss' + lossTone(ping && ping.loss_pct) + '">' + lossText(ping && ping.loss_pct) + '</div>' +
        "</div>" +
      "</header>"
    );
  }

  function pingTargetsHTML(s) {
    const pings = s.ping || [];
    if (!pings.length) return '<span class="hero-sub">暂无 Ping Task 数据</span>';
    let html = '';
    html += pings.map(function (p) {
      const danger = (p.current_ms != null && Number(p.current_ms) > 180) || (p.loss_pct != null && Number(p.loss_pct) > 20);
      return '<button type="button" class="chip' + (p.key === targetKey ? " is-on" : "") + (danger ? " is-bad" : "") + '" data-target="' + attr(p.key) + '">' + h(p.label) + ' · ' + h(pingText(p)) + ' · ' + lossHTML(p.loss_pct) + '</button>';
    }).join('');
    return html;
  }

  function pageHTML(index) {
    const ctx = nodeCtx(index);
    if (!ctx) return "";
    const s = ctx.s;
    const routes = effectiveRoutes(s);
    const mem = pctMetric(s.mem_used, s.mem_total);
    const disk = pctMetric(s.disk_used, s.disk_total);
    const trafficSub = s.traffic_limit ? ('限额 ' + fmtBytes(s.traffic_limit, 2)) : '无限额';
    return (
      '<article class="sheet">' +
        heroLine(s, heroPingSummary(s)) +
        heroPingChart(ctx, 960, 50, "y") +
        '<section class="kpi">' +
          '<article><div class="lbl">下行</div><div class="val">' + fmtSpeed(s.download_speed) + '</div><div class="sub">上行 ' + fmtSpeed(s.upload_speed) + "</div></article>" +
          '<article><div class="lbl">CPU</div><div class="val">' + pctText(s.cpu_pct) + '</div><div class="sub">负载 ' + h((s.loadavg || "—").toString().trim().split(/\s+/).join(" · ")) + "</div></article>" +
          '<article><div class="lbl">内存</div><div class="val">' + pctText(mem) + '</div><div class="sub">' + fmtBytes(s.mem_used, 1) + " / " + fmtBytes(s.mem_total, 0) + "</div></article>" +
          '<article><div class="lbl">硬盘</div><div class="val">' + pctText(disk) + '</div><div class="sub">' + fmtBytes(s.disk_used, 0) + " / " + fmtBytes(s.disk_total, 0) + "</div></article>" +
          '<article><div class="lbl">流量累计</div><div class="val">' + fmtBytes(s.traffic_used, 1) + '</div><div class="sub">' + trafficSub + " · " + lossHTML(ctx.ping && ctx.ping.loss_pct) + "</div></article>" +
        "</section>" +
        '<section class="sheet-mid">' +
          '<div class="panel tight">' +
            '<div class="panel-h"><h3>延迟</h3>' +
              '<div class="seg">' + ["1h", "6h", "24h"].map(function (k) {
                return '<button type="button" data-range="' + k + '" class="' + (range === k ? "is-on" : "") + '">' + k + "</button>";
              }).join("") + "</div>" +
            "</div>" +
            '<div class="targets">' + pingTargetsHTML(s) + "</div>" +
            pingChart(ctx, 520, 96, "y") +
          "</div>" +
          '<div class="panel tight">' +
            '<div class="panel-h"><h3>近 7 日</h3><span class="hero-sub">' + (ctx.last7.length ? ('均 ' + fmtBytes(ctx.st.avg, 1) + ' · 高 ' + fmtBytes(ctx.st.high, 1)) : '按 Komari 历史记录') + "</span></div>" +
            trafficHistoryHTML(ctx, 320, 88) +
            (ctx.last7.length ? '<div class="day-inline">' + ctx.last7.map(function (d) {
              return "<span>" + h(d.date.slice(8)) + " " + fmtBytes(d.total, 1) + "</span>";
            }).join("") + "</div>" : '') +
          "</div>" +
        "</section>" +
        '<section class="sheet-bot">' +
          '<div class="panel tight">' +
            '<div class="panel-h"><h3>三网回程</h3></div>' +
            '<div class="routes compact">' +
              (routes.length ? routes.map(function (rt) {

              }).join("") : '<div class="hero-sub">暂无回程；可在 metadata/nodes.json 按 UUID 补充</div>') +
            "</div>" +
          "</div>" +
          '<div class="panel tight">' +
            '<div class="panel-h"><h3>系统</h3></div>' +

              "<div>架构 <b>" + h(s.arch || "—") + "</b></div>" +
              "<div>CPU <b>" + h(s.cpu_model || "—") + " · " + h(s.cpu_cores == null ? "—" : s.cpu_cores) + "C/" + h(s.cpu_threads == null ? "—" : s.cpu_threads) + "T</b></div>" +
              "<div>到期 <b>" + h(s.expires_at || "—") + "</b></div>" +
              "<div>续费 <b>" + h(renewalText(s)) + "</b></div>" +
            "</div>" +
            '<div class="mobile-sys-grid">' +
              '<div><span>系统</span><b>' + h(compactOS(s.os)) + '</b></div>' +
              '<div><span>架构</span><b>' + h((s.arch || "—") + (s.virtualization ? " · " + s.virtualization : "")) + '</b></div>' +
              '<div class="wide"><span>CPU</span><b>' + h(compactCPU(s.cpu_model)) + (s.cpu_cores != null || s.cpu_threads != null ? ' · ' + h(s.cpu_cores == null ? "—" : s.cpu_cores) + 'C/' + h(s.cpu_threads == null ? "—" : s.cpu_threads) + 'T' : '') + '</b></div>' +
              '<div><span>内核</span><b>' + h(compactKernel(s.kernel)) + '</b></div>' +
              '<div><span>到期</span><b>' + h(s.expires_at || "—") + '</b></div>' +
              '<div><span>续费</span><b>' + h(renewalText(s)) + '</b></div>' +
              (s.asn ? '<div class="wide"><span>ASN</span><b>' + h(s.asn + (s.asn_org ? " · " + s.asn_org : "")) + '</b></div>' : '') +
            '</div>' +
          "</div>" +
        "</section>" +
      "</article>"
    );
  }

  function latencyPageCtx(index) {
    const s = serverByKey(index);
    if (!s) return null;
    const key = latencyTargetKey || "all";
    const ping = key === "all" ? null : ((s.ping || []).find(function (p) { return p.key === key; }) || (s.ping || [])[0] || null);
    const cacheKey = s.uuid + ":" + range + ":" + key;
    const cached = seriesCache[cacheKey];
    let sparkVals = [];
    let multiSeries = [];
    if (cached) {
      sparkVals = (cached.series || []).map(function (p) { return p && p.value != null && Number.isFinite(Number(p.value)) ? Number(p.value) : -1; });
      multiSeries = cached.seriesByTask || [];
    } else if (range === "1h" && key === "all") {
      multiSeries = (s.ping || []).map(function (p) { return { key: p.key, label: p.label, points: (p.buckets || []).map(function (b) { return { value: b.ms, t: b.t }; }) }; });
    } else if (range === "1h" && ping && ping.buckets) {
      sparkVals = ping.buckets.map(function (b) { return b.ms; });
    }
    return { s: s, ping: ping, sparkVals: sparkVals, multiSeries: multiSeries, st: dailyStats(s), last7: (s.daily_traffic || []).slice(-7) };
  }

  function latencyPageTargetsHTML(s) {
    const pings = s.ping || [];
    if (!pings.length) return '<span class="hero-sub">暂无 Ping Task 数据</span>';
    let html = '';
    if (pings.length > 1) html += '<button type="button" class="chip' + (latencyTargetKey === "all" ? ' is-on' : '') + '" data-latency-target="all">多线合并</button>';
    html += pings.map(function (p) {
      const danger = (p.current_ms != null && Number(p.current_ms) > 180) || (p.loss_pct != null && Number(p.loss_pct) >= 10);
      return '<button type="button" class="chip' + (latencyTargetKey === p.key ? ' is-on' : '') + (danger ? ' is-bad' : '') + '" data-latency-target="' + attr(p.key) + '">' + h(p.label) + ' · ' + h(pingText(p)) + ' · ' + lossHTML(p.loss_pct) + '</button>';
    }).join('');
    return html;
  }

  function latencyPageChart(ctx, w, ht) {
    if (!ctx) return '<div class="chart-empty">暂无 Ping Task 数据</div>';
    if (latencyTargetKey === "all" && ctx.multiSeries && ctx.multiSeries.length > 1 && ProbeCharts.multiSpark) {

    return ProbeCharts.spark(ctx.sparkVals, pingChartOpts("xy", { w: w, h: ht, color: pingColor(ctx.ping, idx), fillOpacity: 0.11, tips: pingTips(ctx.sparkVals, range === "24h" ? 30 : range === "6h" ? 10 : 5) }));
  }

  function pagePing(ctx) {

      '<article class="page page-ping">' +
        '<div class="panel-h">' +
          "<div><h3 style='margin:0'>Latency / Packet Loss</h3></div>" +

            ["1h", "6h", "24h"].map(function (k) {

          return '<article><div class="lbl">' + h(p.label) + '</div><div class="val' + latencyTone(p.current_ms) + '">' + h(pingText(p)) + '</div><div class="sub"><span class="loss-value' + lossTone(p.loss_pct) + '">' + lossText(p.loss_pct) + '</span> · avg ' + h(p.avg_ms == null ? '—' : Math.round(p.avg_ms) + 'ms') + ' · p99 ' + h(p.p99_ms == null ? '—' : Math.round(p.p99_ms) + 'ms') + '</div></article>';
        }).join('') + '</section>' +
      "</article>"
    );
  }

  function pageTraffic(ctx) {
    const s = ctx.s;
    return (
      '<article class="page page-traffic">' +
