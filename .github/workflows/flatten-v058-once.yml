name: Flatten v0.5.8 source once

on:
  push:
    branches: ['refactor/v0.5.8-source-flatten']

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rewrite shipped runtime as canonical source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/features-lite-native.js ]; then
            echo 'flatten already applied'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          html = (root / 'dist/index.html').read_text()
          (root / 'src').mkdir(exist_ok=True)

          style = re.search(r'<style data-inline-source="dist/css/app.css">\n?(.*?)</style>', html, re.S)
          if not style:
              raise SystemExit('final style block not found')
          css = style.group(1).rstrip() + '\n'

          scripts = []
          for m in re.finditer(r'<script data-inline-source="([^"]+)">\n?(.*?)</script>', html, re.S):
              src = m.group(1)
              if src in ('dist/metadata/nodes.json', 'dist/js/config.js'):
                  continue
              scripts.append('/* ' + src.rsplit('/', 1)[-1] + ' */\n' + m.group(2).rstrip())
          js = '\n\n'.join(scripts) + '\n'

          js = re.sub(
              r"\n  function trimSlash\(value\) \{.*?\n  function rpcUrl\(\) \{\n    return \(base\(\) \|\| ''\) \+ '/api/rpc2';\n  \}\n",
              "\n  function rpcUrl() {\n    return '/api/rpc2';\n  }\n",
              js,
              flags=re.S,
          )
          js = re.sub(r"\n  function metadataFor\(metadata, uuid\) \{.*?\n  \}\n", "\n", js, flags=re.S)
          js = js.replace('function mapNode(node, live, metadata, order) {', 'function mapNode(node, live, order) {')
          js = js.replace('    const ext = metadataFor(metadata, uuid);\n', '')
          js = js.replace(
              "      region_city: String(ext.region_city || ''),\n      provider_name: String(ext.provider_name || ''),\n      provider_url: String(ext.provider_url || ''),\n      longitude: numberOrNull(ext.longitude),\n      latitude: numberOrNull(ext.latitude),",
              "      region_city: String(node.region_city || node.city || ''),\n      provider_name: String(node.provider_name || ''),\n      provider_url: String(node.provider_url || ''),\n      longitude: numberOrNull(node.longitude),\n      latitude: numberOrNull(node.latitude),",
          )
          js = js.replace(
              "      asn: String(ext.asn || ''),\n      asn_org: String(ext.asn_org || ''),",
              "      asn: String(node.asn || ''),\n      asn_org: String(node.asn_org || ''),",
          )
          js = js.replace('function snapshot(nodesRaw, latestRaw, publicRaw, metadata) {', 'function snapshot(nodesRaw, latestRaw, publicRaw) {')
          js = js.replace('      return mapNode(node, latest[String(node.uuid)] || null, metadata || {}, index);', '      return mapNode(node, latest[String(node.uuid)] || null, index);')
          js = re.sub(r"\n  function loadMetadata\(\) \{.*?\n  \}\n", "\n", js, flags=re.S)
          js = js.replace(
              "      rpc('common:getPublicInfo', {}, 6000).catch(function () { return {}; }),\n      loadMetadata(),",
              "      rpc('common:getPublicInfo', {}, 6000).catch(function () { return {}; }),",
          )
          js = js.replace('      lastPayload = LiteAdapt.snapshot(parts[0], parts[1], parts[2], parts[3]);', '      lastPayload = LiteAdapt.snapshot(parts[0], parts[1], parts[2]);')

          js = js.replace(
              '  const systemHistoryCache = Object.create(null);\n  const systemHistoryInFlight = Object.create(null);',
              '  const systemHistoryCache = Object.create(null);\n  const systemHistoryInFlight = Object.create(null);\n  const SYSTEM_HISTORY_TTL_MS = 90000;',
          )
          js = js.replace(
              '    const out = { range: value, hours: systemHistoryHours(value), cpu: [], ram: [], disk: [], count: rows.length };',
              '    const out = { range: value, hours: systemHistoryHours(value), cpu: [], ram: [], disk: [], count: rows.length, fetchedAt: Date.now() };',
          )
          js = js.replace(
              '      domainStart: Date.now() - data.hours * 3600000, domainEnd: Date.now(), windowHours: data.hours',
              '      domainStart: (data.fetchedAt || Date.now()) - data.hours * 3600000, domainEnd: data.fetchedAt || Date.now(), windowHours: data.hours',
          )
          old_cache = '''    const key = systemHistoryKey(uuid, value);\n    if (systemHistoryCache[key]) { paintSystemHistory(uuid, value, systemHistoryCache[key]); return Promise.resolve(systemHistoryCache[key]); }\n    if (systemHistoryInFlight[key]) return systemHistoryInFlight[key];'''
          new_cache = '''    const key = systemHistoryKey(uuid, value);\n    const cached = systemHistoryCache[key];\n    if (cached && Date.now() - cached.at < SYSTEM_HISTORY_TTL_MS) { paintSystemHistory(uuid, value, cached.data); return Promise.resolve(cached.data); }\n    if (cached) delete systemHistoryCache[key];\n    if (systemHistoryInFlight[key]) return systemHistoryInFlight[key];'''
          if old_cache not in js:
              raise SystemExit('history cache marker not found')
          js = js.replace(old_cache, new_cache)
          js = js.replace(
              '.then(function (raw) { const data = systemHistoryData(raw, uuid, value); systemHistoryCache[key] = data; paintSystemHistory(uuid, value, data); return data; })',
              '.then(function (raw) { const data = systemHistoryData(raw, uuid, value); systemHistoryCache[key] = { data: data, at: Date.now() }; paintSystemHistory(uuid, value, data); return data; })',
          )

          old_globe = '''    }).join("");\n    return wire + links + pins +\n      '<text class="globe-caption" x="230" y="' + (cy + R + 28) + '" text-anchor="middle" font-size="8" font-family="IBM Plex Mono, monospace" letter-spacing="1.4">' + globeCaption() + " · " + cfg.key.toUpperCase() + "</text>";'''
          new_globe = '''    }).join("");\n    let selectedMarker = "";\n    if (globePinned && regionFilter) {\n      const p = ortho(globeLon, globeLat);\n      if (p) selectedMarker = '<g class="globe-selected" aria-label="' + attr(regionFilter) + '"><circle class="globe-selected-ring" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="7"/><circle class="globe-selected-core" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="2.4"/></g>';\n    }\n    return wire + links + pins + selectedMarker +\n      '<text class="globe-caption" x="230" y="' + (cy + R + 28) + '" text-anchor="middle" font-size="8" font-family="IBM Plex Mono, monospace" letter-spacing="1.4">' + globeCaption() + " · " + cfg.key.toUpperCase() + "</text>";'''
          if old_globe not in js:
              raise SystemExit('globe marker anchor not found')
          js = js.replace(old_globe, new_globe)
          css += '\n.globe-selected-ring { fill:none; stroke:var(--ink); stroke-width:1.2; stroke-dasharray:2 2; vector-effect:non-scaling-stroke; }\n.globe-selected-core { fill:var(--ink); stroke:var(--void); stroke-width:1.4; vector-effect:non-scaling-stroke; }\n'

          source = html
          source = re.sub(r'<style data-inline-source="dist/css/app.css">\n?.*?</style>', '<link rel="stylesheet" href="./style.css" data-inline-href="src/style.css">', source, flags=re.S)
          source = re.sub(r'\n?\s*<script data-inline-source="(?:dist/metadata/nodes.json|dist/js/[^\"]+)">.*?</script>', '', source, flags=re.S)
          source = source.replace('</body>', '  <script src="./app.js" data-inline-src="src/app.js"></script>\n</body>')
          source = re.sub(r'<meta name="line-grid-version" content="[^"]+">', '<meta name="line-grid-version" content="__LINE_GRID_VERSION__">', source)
          source = re.sub(r'\n{3,}', '\n\n', source)

          (root / 'src/index.html').write_text(source)
          (root / 'src/style.css').write_text(css)
          (root / 'src/app.js').write_text(js)

          manifest_path = root / 'Lite-theme.json'
          manifest = json.loads(manifest_path.read_text())
          manifest['version'] = '0.5.8'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          (root / 'README.md').write_text('''# Line Grid\n\nLine Grid 是 [nuomiiiii/Lite](https://github.com/nuomiiiii/Lite) 的第三方主题。v0.5.1 起仅支持 Lite；Komari 兼容版冻结在 `release/v0.4.3`。\n\n## 功能\n\n- List / Grid / Column；Overview / Latency / Traffic / System。\n- 1H / 6H / 24H / 7D 延迟、多 Ping Task、流量、资源与费用概况。\n- CPU / RAM / Disk 历史读取 Lite；Globe 城市定位、异常提示与移动端适配。\n- Web / System 字体；GeoIP / ASN 可选增强。\n\n## 安装与数据\n\n从 Release 下载 `komari-line-grid-vX.Y.Z.zip` 在 Lite 导入。安装包仅含 `Lite-theme.json`、`preview.svg`、`dist/index.html`。\n\n节点、状态、账期和历史以 Lite RPC2 / Metric Store 为准，主题不提供后端接口。GeoIP 默认关闭；费用仅登录后显示。\n\n## 开发\n\n源码仅在 `src/`。`./scripts/test.sh` 测试，`./scripts/package.sh` 打包。\n\n## 上游与许可\n\n基于 [selkk-lab/mmwx-theme-line-grid](https://github.com/selkk-lab/mmwx-theme-line-grid) 移植与重构；运行环境为 [nuomiiiii/Lite](https://github.com/nuomiiiii/Lite)。本项目采用 [MIT License](./LICENSE)。\n''')

          (root / 'CHANGELOG.md').write_text('''# Changelog\n\n## v0.5.8\n\n- Flatten the post-migration build into canonical `src/index.html`, `src/style.css`, and `src/app.js`; `dist/` now contains only the generated self-contained release page.\n- Remove the historical `slim-*`, runtime/refine/hardening patch chain after writing shipped behavior back into source.\n- Remove the metadata/config compatibility layer and `?api=` override; monitor data uses same-origin Lite `/api/rpc2` directly.\n- Add a 90-second TTL to lazy CPU / RAM / Disk history without adding background polling.\n- Add an explicit selected-city globe marker while preserving pin-to-stop and `ALL`-to-resume behavior.\n- Simplify CI and release validation around the flattened source tree and minimal three-file package.\n\n## v0.5.7\n\n- Harden currency conversion, GeoIP privacy, Ping/history failure handling, resource null semantics, finance counting, footer freshness, and chart tooltip performance.\n- Add compact high-frequency Lite status polling with periodic full Ping refresh.\n- Add lazy CPU / RAM / Disk history via Lite `common:getRecords(type=load)` with 1H / 24H / 7D ranges.\n- Add Lite-managed Web / System font mode and globe city/region pinning.\n\n## v0.5.6\n\n- Complete the Lite-only migration; remove legacy Komari runtime paths, demo data, theme-owned traffic reset writes, and Return-route editor logic.\n- Add truthful latency ranges, traffic/resource/finance views, anomaly hints, hardware fixes, mobile refinements, and a minimal three-file install package.\n\n## v0.4.3\n\n- Add billing time-zone handling, reproducible self-contained builds, CI packaging, exchange-rate gating, and selectable GeoIP behavior.\n- Historical Komari-compatible line is frozen at `release/v0.4.3`.\n\n## Earlier\n\n- v0.4.x introduced current-cycle traffic, search, anomaly filtering, Last Seen, globe performance work, and reproducible releases.\n- v0.2.x established node ordering, merged Ping Task rendering, geographic scatter behavior, and traffic-history fallbacks.\n''')
          PY

          cat > scripts/build-release.js <<'EOF'
          #!/usr/bin/env node
          'use strict';
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve(__dirname, '..');
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'Lite-theme.json'), 'utf8'));
          const templatePath = path.join(root, 'src/index.html');
          const outPath = path.join(root, 'dist/index.html');
          const checkOnly = process.argv.includes('--check');
          function escScript(source) { return source.replace(/<\/script/gi, '<\\/script'); }
          function build() {
            let html = fs.readFileSync(templatePath, 'utf8');
            html = html.replace(/__LINE_GRID_VERSION__/g, String(manifest.version || ''));
            html = html.replace(/<link\s+rel="stylesheet"\s+href="[^"]*"\s+data-inline-href="([^"]+)"\s*>/g, function (_m, rel) {
              return '<style>\n' + fs.readFileSync(path.join(root, rel), 'utf8') + '\n</style>';
            });
            html = html.replace(/<script\s+src="[^"]*"\s+data-inline-src="([^"]+)"\s*><\/script>/g, function (_m, rel) {
              return '<script>\n' + escScript(fs.readFileSync(path.join(root, rel), 'utf8')) + '\n</script>';
            });
            if (/data-inline-(?:src|href)=/.test(html)) throw new Error('unresolved inline marker');
            if (/__LINE_GRID_VERSION__/.test(html)) throw new Error('unresolved version marker');
            return html;
          }
          const html = build();
          fs.mkdirSync(path.dirname(outPath), { recursive: true });
          if (checkOnly) {
            const current = fs.existsSync(outPath) ? fs.readFileSync(outPath, 'utf8') : '';
            if (current !== html) { console.error('dist/index.html is stale. Run: node scripts/build-release.js'); process.exit(1); }
            console.log('release index is reproducible');
          } else {
            fs.writeFileSync(outPath, html);
            console.log(outPath);
          }
          EOF

          cat > scripts/package.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "$0")/.." && pwd)"
          cd "$ROOT"
          node scripts/build-release.js >/dev/null
          VERSION="$(node -p "require('./Lite-theme.json').version")"
          OUT="komari-line-grid-v${VERSION}.zip"
          rm -f "$OUT"
          zip -q "$OUT" Lite-theme.json preview.svg dist/index.html
          printf '%s\n' "$OUT"
          EOF

          cat > scripts/test.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "$0")/.." && pwd)"
          cd "$ROOT"
          node --check src/app.js
          node --check scripts/build-release.js
          node scripts/build-release.js >/dev/null
          node scripts/build-release.js --check >/dev/null
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('Lite-theme.json','utf8'));
          const source = fs.readFileSync('src/app.js','utf8');
          const css = fs.readFileSync('src/style.css','utf8');
          const html = fs.readFileSync('dist/index.html','utf8');
          if (!/^\d+\.\d+\.\d+$/.test(String(manifest.version || ''))) throw new Error('manifest version must be SemVer x.y.z');
          if (!html.includes(`name="line-grid-version" content="${manifest.version}"`)) throw new Error('built version mismatch');
          for (const path of ['src/index.html','src/style.css','src/app.js']) if (!fs.existsSync(path)) throw new Error('missing source '+path);
          for (const path of ['dist/js','dist/css','dist/img','dist/metadata']) if (fs.existsSync(path)) throw new Error('legacy dist source tree remains: '+path);
          for (const token of ['ProbeConfig','LINE_GRID_METADATA','loadMetadata(','metadataFor(','query.get(\'api\')','ProbeDemo']) if (source.includes(token)) throw new Error('legacy runtime layer remains: '+token);
          if (!source.includes("function rpcUrl() {\n    return '/api/rpc2';")) throw new Error('Lite same-origin RPC2 endpoint not fixed');
          const apiPaths = [...source.matchAll(/[\"'](\/api\/[^\"']+)/g)].map(m=>m[1]);
          if (apiPaths.some(p=>p !== '/api/rpc2')) throw new Error('unexpected API path: '+apiPaths.join(','));
          for (const method of ['common:getNodes','common:getNodesLatestStatus','common:getPublicInfo','common:getRecords','public:queryMetrics','common:getMe']) if (!source.includes(method)) throw new Error('Lite RPC missing '+method);
          for (const token of ['const SYSTEM_HISTORY_TTL_MS = 90000','Date.now() - cached.at < SYSTEM_HISTORY_TTL_MS','systemHistoryCache[key] = { data: data, at: Date.now() }']) if (!source.includes(token)) throw new Error('history TTL missing: '+token);
          for (const token of ['globe-selected-ring','globe-selected-core','if (globePinned && regionFilter)','if (globePinned) return;']) if (!(source+css).includes(token)) throw new Error('globe selected marker missing: '+token);
          if (/<link[^>]+fonts\.(?:googleapis|gstatic)\.com/i.test(html)) throw new Error('external fonts eagerly loaded');
          if (!source.includes('https://fonts.googleapis.com/css2?family=')) throw new Error('optional Web font mode missing');
          if (!css.includes('html[data-font-mode="system"]')) throw new Error('System font mode missing');
          const startup = source.slice(source.lastIndexOf('render();\n  ProbeAPI.fetchServers()'));
          if (!startup.includes('ProbeAPI.fetchServers()') || startup.includes('loadSystemHistory(')) throw new Error('resource history must remain lazy');
          if (/data-inline-(?:src|href)=/.test(html)) throw new Error('release has unresolved inline marker');
          if (/(?:src|href)="\.\/(?:app\.(?:js|css)|src\/)/.test(html)) throw new Error('release is not self-contained');
          if (!html.includes('data:image/png;base64,')) throw new Error('release grain asset is not self-contained');
          console.log('flattened Lite-only runtime checks passed');
          NODE
          ./scripts/package.sh >/dev/null
          python3 - <<'PY'
          import json
          from zipfile import ZipFile
          version=json.load(open('Lite-theme.json'))['version']
          name=f'komari-line-grid-v{version}.zip'
          required={'Lite-theme.json','preview.svg','dist/index.html'}
          with ZipFile(name) as z:
              if set(z.namelist()) != required: raise SystemExit('package contents mismatch')
              if f'content="{version}"' not in z.read('dist/index.html').decode(): raise SystemExit('zip version mismatch')
          print('minimal release package ok')
          PY
          echo 'all checks passed'
          EOF

          cat > .github/workflows/build-theme.yml <<'EOF'
          name: Build theme

          on:
            push:
              branches: [main]
              tags: ['v*']
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            test-and-package:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Test
                  run: ./scripts/test.sh
                - name: Package
                  run: ./scripts/package.sh
                - name: Upload theme package
                  uses: actions/upload-artifact@v4
                  with:
                    name: komari-line-grid-theme
                    path: komari-line-grid-v*.zip
                    if-no-files-found: error

            sync-generated-index:
              if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
              needs: test-and-package
              runs-on: ubuntu-latest
              permissions:
                contents: write
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Build and sync generated release index
                  shell: bash
                  run: |
                    set -euo pipefail
                    node scripts/build-release.js >/dev/null
                    if git diff --quiet -- dist/index.html; then exit 0; fi
                    VERSION="$(node -p "require('./Lite-theme.json').version")"
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add dist/index.html
                    git commit -m "build: sync v${VERSION} release index"
                    git push

            github-release:
              if: startsWith(github.ref, 'refs/tags/v')
              needs: test-and-package
              runs-on: ubuntu-latest
              permissions:
                contents: write
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Build installable package
                  run: ./scripts/package.sh
                - name: Validate tag matches manifest version
                  shell: bash
                  run: |
                    VERSION="$(node -p "require('./Lite-theme.json').version")"
                    test "${GITHUB_REF_NAME}" = "v${VERSION}"
                - name: Create release and upload installable ZIP only
                  env:
                    GH_TOKEN: ${{ github.token }}
                  shell: bash
                  run: |
                    VERSION="$(node -p "require('./Lite-theme.json').version")"
                    ASSET="komari-line-grid-v${VERSION}.zip"
                    if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                      gh release create "$GITHUB_REF_NAME" --title "Line Grid ${GITHUB_REF_NAME}" --generate-notes
                    fi
                    gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          EOF

          chmod +x scripts/build-release.js scripts/package.sh scripts/test.sh
          rm -rf dist/css dist/img dist/js dist/metadata
          find scripts -maxdepth 1 -type f ! -name build-release.js ! -name package.sh ! -name test.sh -delete
          node scripts/build-release.js >/dev/null
          ./scripts/test.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: flatten v0.5.8 source architecture'
          git push origin HEAD:"${GITHUB_REF_NAME}"
