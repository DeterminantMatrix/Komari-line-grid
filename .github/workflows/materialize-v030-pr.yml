name: Finalize v0.3.0 after PR merge

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.title == 'v0.3.0 server materializer' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore source bundle when still staged
        shell: bash
        run: |
          if compgen -G 'scripts/source-bundle.b64.part-*' >/dev/null; then
            cat scripts/source-bundle.b64.part-* | base64 -d > /tmp/source-bundle.tar.gz
            expected="$(cat scripts/source-bundle.sha256)"
            actual="$(sha256sum /tmp/source-bundle.tar.gz | awk '{print $1}')"
            test "$actual" = "$expected"
            tar -xzf /tmp/source-bundle.tar.gz
          fi
          test "$(node -p "require('./komari-theme.json').version")" = '0.3.0'
      - name: Validate and package
        shell: bash
        run: |
          ./scripts/test.sh
          ./scripts/package.sh
      - name: Clean staging and materialize final tree
        shell: bash
        run: |
          rm -f scripts/source-bundle.b64.part-* scripts/source-bundle.sha256
          rm -f scripts/pr-materialize-trigger.txt scripts/pr-finalize-trigger.txt
          rm -f .github/workflows/materialize-v030.yml .github/workflows/materialize-v030-pr.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize Komari Line Grid v0.3.0 source'
            git push origin HEAD:main
          fi
      - name: Publish v0.3.0 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag='v0.3.0'
          target="$(git rev-parse HEAD)"
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" komari-line-grid.zip --clobber && exit 0
            else
              gh release create "$tag" komari-line-grid.zip --target "$target" --title "$tag" --notes 'Komari Line Grid v0.3.0. Preferred Line Grid UI rebased on current Komari RPC2 semantics.' && exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Close old trigger issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue close 1 --comment 'Superseded by the server-side PR materializer.' || true
