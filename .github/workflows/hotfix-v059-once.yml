name: Hotfix v0.5.9 once

on:
  push:
    branches:
      - hotfix/v0.5.9-api-init

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.5.9-api-init
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hotfix and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          app = Path('src/app.js')
          s = app.read_text()
          needle = '    base: base,\n'
          if s.count(needle) != 1:
              raise SystemExit(f'expected one stale ProbeAPI base export, found {s.count(needle)}')
          app.write_text(s.replace(needle, '', 1))

          manifest = Path('Lite-theme.json')
          data = json.loads(manifest.read_text())
          data['version'] = '0.5.9'
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          changelog = Path('CHANGELOG.md')
          old = changelog.read_text()
          entry = '# Changelog\n\n## v0.5.9\n\n- Fix a v0.5.8 startup regression caused by a stale `base` export after removing legacy API-base compatibility.\n- Add a runtime initialization smoke test so undeclared globals in the pre-app runtime fail CI.\n\n'
          if not old.startswith('# Changelog\n'):
              raise SystemExit('unexpected changelog header')
          changelog.write_text(entry + old[len('# Changelog\n\n'):])
          PY

          cat > scripts/test-runtime-init.js <<'JS'
          const fs = require('fs');
          const vm = require('vm');

          const source = fs.readFileSync('src/app.js', 'utf8');
          const cut = source.indexOf('/* lite.js */');
          if (cut < 0) throw new Error('lite runtime marker missing');
          const prefix = source.slice(0, cut);
          const storage = new Map();
          const documentElement = { setAttribute() {}, getAttribute() { return null; }, style: {} };
          const document = {
            documentElement,
            readyState: 'complete',
            hidden: false,
            body: { appendChild() {}, classList: { add() {}, remove() {}, toggle() {} } },
            getElementById() { return null; },
            createElement() { return { setAttribute() {}, addEventListener() {}, querySelector() { return null; }, classList: { toggle() {} } }; },
            addEventListener() {},
            removeEventListener() {},
            dispatchEvent() {},
            querySelectorAll() { return []; },
          };
          const context = {
            console,
            document,
            location: { hostname: 'theme.test', origin: 'https://theme.test', pathname: '/', search: '', hash: '' },
            localStorage: {
              getItem(key) { return storage.get(key) || null; },
              setItem(key, value) { storage.set(key, String(value)); },
              removeItem(key) { storage.delete(key); },
            },
            matchMedia() { return { matches: false, addEventListener() {}, removeEventListener() {} }; },
            fetch() { return Promise.reject(new Error('network disabled in runtime init test')); },
            setTimeout, clearTimeout, setInterval, clearInterval,
            Promise, Map, Set, WeakMap, URL, URLSearchParams, AbortController, Intl, Date, Math, Number, String, Object, Array, JSON, RegExp,
            encodeURIComponent, decodeURIComponent,
            CustomEvent: function CustomEvent() {},
            performance: { now() { return 0; } },
            requestAnimationFrame() { return 0; },
            cancelAnimationFrame() {},
          };
          context.window = context;
          context.globalThis = context;
          vm.createContext(context);
          vm.runInContext(prefix, context, { filename: 'src/app.js' });
          if (!context.ProbeAPI || typeof context.ProbeAPI.fetchServers !== 'function' || typeof context.ProbeAPI.rpc !== 'function') {
            throw new Error('ProbeAPI runtime initialization failed');
          }
          console.log('runtime initialization smoke test passed');
          JS

          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/test.sh')
          s = p.read_text()
          needle = "node --check src/app.js; node --check scripts/build-release.js; node scripts/build-release.js >/dev/null; node scripts/build-release.js --check >/dev/null\n"
          repl = "node --check src/app.js; node --check scripts/build-release.js; node scripts/test-runtime-init.js; node scripts/build-release.js >/dev/null; node scripts/build-release.js --check >/dev/null\n"
          if s.count(needle) != 1:
              raise SystemExit('test.sh insertion marker mismatch')
          p.write_text(s.replace(needle, repl, 1))
          PY

          ./scripts/test.sh

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js Lite-theme.json CHANGELOG.md scripts/test.sh scripts/test-runtime-init.js dist/index.html
          git diff --cached --check
          git commit -m 'fix: restore Lite API runtime initialization'
          git push origin HEAD:hotfix/v0.5.9-api-init
