name: Tune v0.6.8 layout typography

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply layout-specific typography and System scrolling fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css = Path('src/style.css')
          text = css.read_text()
          marker = '/* v0.6.8 layout-aware typography tuning */'
          if marker in text:
              raise SystemExit('layout tuning already applied')
          block = '''

          /* v0.6.8 layout-aware typography tuning */
          /* System owns its scroll area: the spec grid stays inside the stage and history scrolls with it. */
          .stage.is-compact-system {
            height: min(86dvh, 820px);
            max-height: min(86dvh, 820px);
          }
          .stage.is-compact-system .stage-body {
            overflow-x: hidden;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--line-strong) transparent;
          }
          .stage.is-compact-system .stage-body::-webkit-scrollbar {
            display: block;
            width: 8px;
            height: 8px;
          }
          .stage.is-compact-system .stage-body::-webkit-scrollbar-track { background: transparent; }
          .stage.is-compact-system .stage-body::-webkit-scrollbar-thumb { background: var(--line-strong); }
          .page-system {
            grid-template-rows: auto auto;
            align-content: start;
          }
          .page-system .spec { height: auto; }

          /* Grid and column layouts keep the original pre-0.6.8 typography. */
          .board .card-coord { font-size: 10px; }
          .board .cc,
          .stack .cc { font-size: 13px; }
          .board .name,
          .stack .name { font-size: 19px; }
          .board .status,
          .stack .status { font-size: 13px; }
          .board .status small,
          .stack .status small { font-size: 8.5px; }
          .board .spark-wrap .ms { font-size: 13px; }
          .board .card-loss,
          .stack .slab-loss { font-size: 9px; }
          .board .meter span,
          .stack .meter span { font-size: 13px; }
          .board .meter small,
          .stack .meter small { font-size: 10px; }
          .board .quota-h,
          .stack .quota-h { font-size: 13px; }
          .board .meta,
          .stack .meta { font-size: 13px; }
          .board .node-alert,
          .stack .node-alert { font-size: 8px; }
          .stack .slab-ms { font-size: 28px; }
          .stack .slab-ms small { font-size: 11px; }
          .stack .slab .more { font-size: 12px; }
          .stack .slab-region { font-size: 11px; }

          /* Horizontal list uses +5% typography; live throughput stays at its original size. */
          .list .row-h { font-size: 10.5px; }
          .list .row .cc { font-size: 13.65px; }
          .list .row .name { font-size: 15.75px; }
          .list .row .node-ip { font-size: 9.45px; }
          .list .row > .status { font-size: 13.65px; }
          .list .row > .status small { font-size: 7.9px; }
          .list .row .latency-cell .ms { font-size: 12.6px; }
          .list .row .latency-cell small { font-size: 9.45px; }
          .list .row .resource-cell b { font-size: 12.6px; }
          .list .row .resource-cell small { font-size: 9.45px; }
          .list .row .quota-cell-n,
          .list .row .quota-reset { font-size: 10.5px; }
          .list .row .life-cost b { font-size: 11.55px; }
          .list .row .life-cost small { font-size: 9.45px; }

          @media (max-width: 720px) {
            .stage.is-compact-system {
              height: 100dvh;
              max-height: 100dvh;
            }
          }
          '''
          # The YAML indentation is part of the Python triple string. Strip the
          # ten-space workflow indentation before appending real CSS.
          lines = block.splitlines()
          block = '\n'.join((line[10:] if line.startswith('          ') else line) for line in lines)
          css.write_text(text.rstrip() + block + '\n')

          test = Path('scripts/test.sh')
          t = test.read_text()
          anchor = "if(!c.includes('.spark-wrap > .spark')||!c.includes('.resource-cell')||!c.includes('.meter small')) throw new Error('responsive spark/resource capacity CSS missing');"
          guard = "if(!c.includes('/* v0.6.8 layout-aware typography tuning */')||!c.includes('.stage.is-compact-system .stage-body')||!c.includes('overflow-y: auto;')||!c.includes('.page-system .spec { height: auto; }')||!c.includes('.list .row .quota-cell-n')||!c.includes('font-size: 10.5px;')||!c.includes('.board .name')||!c.includes('.stack .slab-ms { font-size: 28px; }')) throw new Error('v0.6.8 layout typography tuning missing');"
          if anchor not in t:
              raise SystemExit('test anchor not found')
          test.write_text(t.replace(anchor, anchor + '\n' + guard, 1))
          PY
      - name: Test and build
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/test.sh
          node scripts/build-release.js >/dev/null
          node scripts/build-release.js --check >/dev/null
      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tune-v068-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/style.css scripts/test.sh dist/index.html .github/workflows/tune-v068-layout.yml
          git diff --cached --check
          git commit -m "fix: tune v0.6.8 typography by layout" -m "Keep detail typography at 110%, reduce horizontal-list typography to 105%, restore grid/column typography to original sizing, and make the System detail page scroll within its stage instead of overflowing it."
          git push origin HEAD:main
