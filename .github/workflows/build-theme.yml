name: Build theme

on:
  push:
    branches: [main, release/v0.5.1]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: ./scripts/test.sh
      - name: Sync generated release index on main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dist/index.html; then
            exit 0
          fi
          VERSION="$(node -p "require('./Lite-theme.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.html
          git commit -m "build: sync v${VERSION} release index"
          git push
      - name: Package
        run: ./scripts/package.sh
      - name: Upload theme package
        uses: actions/upload-artifact@v4
        with:
          name: komari-line-grid-theme
          path: komari-line-grid-v*.zip
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build installable package
        run: ./scripts/package.sh
      - name: Validate tag matches manifest version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./Lite-theme.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Create release and upload installable ZIP only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./Lite-theme.json').version")"
          ASSET="komari-line-grid-v${VERSION}.zip"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Line Grid ${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
