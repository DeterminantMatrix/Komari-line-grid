name: Build Komari theme

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply staged hotfix patch
        shell: bash
        run: |
          if compgen -G 'scripts/hotfix.b64.part-*' >/dev/null; then
            cat scripts/hotfix.b64.part-* | base64 -d > /tmp/line-grid-hotfix.patch
            git apply --check /tmp/line-grid-hotfix.patch
            git apply /tmp/line-grid-hotfix.patch
          fi

      - name: Restore staged source bundle
        shell: bash
        run: |
          if compgen -G 'scripts/source-bundle.part-*' >/dev/null; then
            cat scripts/source-bundle.part-* > /tmp/source-bundle.tar.gz
            expected="$(cat scripts/source-bundle.sha256)"
            actual="$(sha256sum /tmp/source-bundle.tar.gz | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "source bundle checksum mismatch: $actual != $expected" >&2
              exit 1
            fi
            tar -xzf /tmp/source-bundle.tar.gz
          fi

      - name: Validate
        run: ./scripts/test.sh

      - name: Package
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: komari-line-grid-theme
          path: komari-line-grid.zip

      - name: Materialize staged source
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          staged=0
          if compgen -G 'scripts/source-bundle.part-*' >/dev/null; then
            rm scripts/source-bundle.part-* scripts/source-bundle.sha256
            staged=1
          fi
          if compgen -G 'scripts/hotfix.b64.part-*' >/dev/null; then
            rm scripts/hotfix.b64.part-*
            staged=1
          fi
          if [[ "$staged" -eq 0 ]]; then
            exit 0
          fi
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          version="$(node -p "require('./komari-theme.json').version")"
          git commit -m "Materialize Komari Line Grid v${version} source"
          git push

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "require('./komari-theme.json').version")"
          tag="v${version}"
          target="$(git rev-parse HEAD)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" komari-line-grid.zip --clobber
          else
            gh release create "$tag" komari-line-grid.zip \
              --target "$target" \
              --title "$tag" \
              --notes "Komari Line Grid ${tag}. Install directly from the repository URL in Komari, or download the attached komari-line-grid.zip theme package."
          fi